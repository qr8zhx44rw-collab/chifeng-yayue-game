<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赤峰雅乐 - 混音模拟器 (Canvas版)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            overflow: hidden;
            touch-action: none;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            background: radial-gradient(circle at center, #ffffff 0%, #f3f6fb 70%, #e9eef6 100%);
            max-width: 100%;
            max-height: 100%;
        }
        #loading {
            position: absolute;
            color: #d4af37;
            font-size: 24px;
            pointer-events: none;
        }

        /* 曲谱按钮 */
        #scoreBtn {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 100;
            background: linear-gradient(135deg, #2a1a00, #4a2e00);
            border: 1px solid #d4af37;
            color: #d4af37;
            font-size: 15px;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 12px rgba(212,175,55,0.3);
            transition: all 0.2s;
        }
        #scoreBtn:hover {
            background: linear-gradient(135deg, #4a2e00, #6b4400);
            box-shadow: 0 0 20px rgba(212,175,55,0.6);
        }

        #bonusVideoOverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 260;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1), rgba(0,0,0,0.82));
            backdrop-filter: blur(3px);
        }
        #bonusVideoOverlay.playing {
            display: flex;
        }
        #bonusVideo {
            width: min(88vw, 1180px);
            max-width: 145vh;
            max-height: 82vh;
            aspect-ratio: 16 / 9;
            border-radius: 28px;
            background: #000;
            box-shadow: 0 32px 100px rgba(0,0,0,0.35);
            object-fit: cover;
        }

        /* 曲谱覆盖层 */
        #scoreOverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(6px);
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            overflow-x: hidden;
        }
        #scoreOverlay.open {
            display: flex;
        }

        /* 覆盖层头部 */
        .overlay-header {
            width: 100%;
            max-width: 860px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 24px 0;
            box-sizing: border-box;
        }
        .overlay-title {
            color: #8b6b18;
            font-size: 22px;
            letter-spacing: 4px;
            font-family: serif;
        }
        .overlay-close {
            background: none;
            border: 1px solid #d2d8e2;
            color: #667085;
            font-size: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .overlay-close:hover {
            border-color: #d4af37;
            color: #d4af37;
        }

        /* 搜索框 */
        .search-wrap {
            width: 100%;
            max-width: 860px;
            padding: 16px 24px;
            box-sizing: border-box;
            display: flex;
            gap: 10px;
        }
        .search-wrap input {
            flex: 1;
            background: #ffffff;
            border: 1px solid #d9dfe9;
            color: #1f2937;
            font-size: 15px;
            padding: 10px 18px;
            border-radius: 24px;
            outline: none;
            font-family: "Microsoft YaHei", sans-serif;
            transition: border-color 0.2s;
        }
        .search-wrap input:focus {
            border-color: #d4af37;
        }

        /* 筛选标签 */
        .filter-wrap {
            width: 100%;
            max-width: 860px;
            padding: 0 24px 14px;
            box-sizing: border-box;
            display: flex;
            gap: 8px;
        }
        .filter-btn {
            background: #f6f8fc;
            border: 1px solid #d7deea;
            color: #667085;
            font-size: 13px;
            padding: 5px 14px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .filter-btn.active {
            background: #fff7e8;
            border-color: #d4af37;
            color: #8b6b18;
        }

        /* 结果区域 */
        .results-wrap {
            width: 100%;
            max-width: 860px;
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 24px;
            box-sizing: border-box;
        }
        .results-wrap::-webkit-scrollbar { width: 4px; }
        .results-wrap::-webkit-scrollbar-track { background: #eef2f8; }
        .results-wrap::-webkit-scrollbar-thumb { background: #c5cfde; border-radius: 2px; }

        .result-count {
            color: #7b8494;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .music-card {
            display: flex;
            gap: 14px;
            align-items: center;
            background: #ffffff;
            border: 1px solid #e1e6ef;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .music-card:hover {
            border-color: #d4af37;
            background: #fffdf7;
            box-shadow: 0 8px 20px rgba(25, 32, 48, 0.06);
        }
        .music-card-cover {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            object-fit: cover;
            background: #eef2f8;
            flex-shrink: 0;
        }
        .music-card-info {
            flex: 1;
            min-width: 0;
        }
        .music-card-title {
            color: #1f2937;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .music-card-meta {
            color: #667085;
            font-size: 13px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tag {
            background: #fff7e8;
            color: #8b6b18;
            border: 1px solid #eed69a;
            border-radius: 4px;
            padding: 1px 7px;
            font-size: 12px;
        }
        .music-card-arrow {
            color: #8a94a7;
            font-size: 18px;
            flex-shrink: 0;
        }

        /* 曲谱查看弹窗 */
        #scoreViewer {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(255,255,255,0.98);
            flex-direction: column;
            align-items: center;
        }
        #scoreViewer.open {
            display: flex;
        }
        .viewer-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            box-sizing: border-box;
            border-bottom: 1px solid #e3e9f2;
        }
        .viewer-title {
            color: #8b6b18;
            font-size: 18px;
            font-family: serif;
            letter-spacing: 2px;
        }
        .viewer-close {
            background: none;
            border: 1px solid #d2d8e2;
            color: #667085;
            font-size: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .viewer-close:hover { border-color: #d4af37; color: #d4af37; }
        .viewer-body {
            flex: 1;
            overflow-y: auto;
            width: 100%;
            max-width: 700px;
            padding: 24px;
            box-sizing: border-box;
        }
        .viewer-desc {
            color: #667085;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 20px;
            border-left: 2px solid #d4af37;
            padding-left: 12px;
            background: #fffdf7;
        }
        .viewer-score-img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #dfe6f0;
        }
        .viewer-no-score {
            text-align: center;
            color: #8a94a7;
            padding: 60px 0;
            font-size: 15px;
        }

        /* 数字资料馆 */
        #scoreOverlay {
            background:
                radial-gradient(circle at 22% 12%, rgba(212,175,55,0.14), transparent 28%),
                linear-gradient(180deg, rgba(255,255,255,0.98), rgba(246,249,253,0.98));
        }
        #scoreOverlay .overlay-header {
            max-width: 1100px;
            padding-top: 22px;
        }
        .archive-panel {
            width: min(1100px, calc(100vw - 42px));
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            margin: 14px 0 34px;
            border: 1px solid rgba(212,175,55,0.24);
            border-radius: 28px;
            background: rgba(255,255,255,0.78);
            box-shadow: 0 28px 80px rgba(31,41,55,0.12);
            overflow: hidden;
        }
        .archive-hero {
            min-height: 150px;
            padding: 28px 34px;
            color: #fff;
            background:
                linear-gradient(90deg, rgba(38,29,14,0.82), rgba(95,68,21,0.48), rgba(255,255,255,0.12)),
                url("assets/archive/banner1.jpg") center/cover;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 28px;
            align-items: end;
        }
        .archive-kicker {
            color: #f1d77b;
            font-size: 13px;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        .archive-hero-title {
            font-family: "Songti SC", "STSong", serif;
            font-size: 34px;
            letter-spacing: 4px;
            line-height: 1.15;
        }
        .archive-hero-desc {
            max-width: 620px;
            margin-top: 12px;
            color: rgba(255,255,255,0.86);
            font-size: 14px;
            line-height: 1.8;
        }
        .archive-stats {
            display: grid;
            grid-template-columns: repeat(3, 86px);
            gap: 10px;
        }
        .archive-stat {
            padding: 12px 10px;
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 16px;
            background: rgba(255,255,255,0.16);
            backdrop-filter: blur(6px);
            text-align: center;
        }
        .archive-stat strong {
            display: block;
            font-size: 22px;
            color: #ffe8a3;
            line-height: 1.1;
        }
        .archive-stat span {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: rgba(255,255,255,0.82);
        }
        .archive-tabs {
            display: flex;
            gap: 10px;
            padding: 16px 22px;
            border-bottom: 1px solid #e7edf5;
            background: rgba(255,255,255,0.88);
        }
        .archive-tab {
            border: 1px solid #d7deea;
            background: #ffffff;
            color: #667085;
            font-size: 14px;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 8px 18px;
            border-radius: 22px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .archive-tab.active {
            color: #8b6b18;
            border-color: #d4af37;
            background: #fff7e8;
            box-shadow: 0 10px 24px rgba(212,175,55,0.14);
        }
        .archive-page {
            display: none;
            padding: 20px 24px 26px;
        }
        .archive-page.active {
            display: block;
        }
        .archive-page .search-wrap,
        .archive-page .filter-wrap,
        .archive-page .results-wrap {
            max-width: none;
            width: 100%;
            padding-left: 0;
            padding-right: 0;
        }
        .archive-page .results-wrap {
            overflow: visible;
            padding-bottom: 0;
        }
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }
        .archive-card {
            background: #fff;
            border: 1px solid #e1e6ef;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 12px 34px rgba(31,41,55,0.06);
        }
        .archive-card h3 {
            margin: 0 0 10px;
            color: #1f2937;
            font-size: 18px;
            font-family: "Songti SC", "STSong", serif;
            letter-spacing: 2px;
        }
        .archive-card p {
            margin: 0;
            color: #667085;
            font-size: 14px;
            line-height: 1.85;
        }
        .archive-wide {
            grid-column: 1 / -1;
        }
        .timeline {
            display: grid;
            gap: 10px;
        }
        .timeline-item {
            display: grid;
            grid-template-columns: 88px 1fr;
            gap: 14px;
            align-items: start;
            padding: 12px 0;
            border-bottom: 1px dashed #d9e1ec;
        }
        .timeline-year {
            color: #8b6b18;
            font-weight: 700;
            font-size: 15px;
        }
        .timeline-text {
            color: #475467;
            font-size: 14px;
            line-height: 1.7;
        }
        .heritage-feature {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .archive-section-title {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin: 24px 0 12px;
        }
        .archive-section-title h3 {
            margin: 0;
            color: #1f2937;
            font-family: "Songti SC", "STSong", serif;
            font-size: 23px;
            letter-spacing: 3px;
        }
        .archive-section-title span {
            color: #8b6b18;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .heritage-person-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin: 16px 0;
        }
        .heritage-person-card {
            position: relative;
            overflow: hidden;
            min-height: 190px;
            padding: 22px;
            border-radius: 20px;
            border: 1px solid #e1e6ef;
            background:
                radial-gradient(circle at 88% 18%, rgba(212,175,55,0.18), transparent 34%),
                linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
            box-shadow: 0 18px 44px rgba(31,41,55,0.07);
        }
        .heritage-person-card::after {
            content: attr(data-mark);
            position: absolute;
            right: 18px;
            bottom: -14px;
            color: rgba(139,107,24,0.08);
            font-size: 88px;
            font-family: "Songti SC", "STSong", serif;
            line-height: 1;
        }
        .heritage-person-card h3,
        .heritage-article-card h3 {
            margin: 0 0 10px;
            color: #1f2937;
            font-family: "Songti SC", "STSong", serif;
            font-size: 22px;
            letter-spacing: 2px;
        }
        .heritage-person-card p {
            position: relative;
            z-index: 1;
            margin: 0;
            color: #5b6678;
            font-size: 14px;
            line-height: 1.85;
        }
        .heritage-tags {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }
        .heritage-tags span {
            color: #8b6b18;
            background: #fff7e8;
            border: 1px solid #eed69a;
            border-radius: 999px;
            padding: 3px 10px;
            font-size: 12px;
        }
        .heritage-article-list {
            display: grid;
            gap: 16px;
        }
        .heritage-article-card {
            border: 1px solid #e1e6ef;
            border-radius: 22px;
            background: #ffffff;
            box-shadow: 0 18px 44px rgba(31,41,55,0.07);
            overflow: hidden;
        }
        .heritage-article-head {
            padding: 22px 24px 18px;
            background:
                linear-gradient(90deg, rgba(255,247,232,0.88), rgba(255,255,255,0.92)),
                radial-gradient(circle at right top, rgba(212,175,55,0.18), transparent 35%);
            border-bottom: 1px solid #edf1f7;
        }
        .heritage-article-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: #8a94a7;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .heritage-article-summary {
            margin: 0;
            color: #667085;
            font-size: 14px;
            line-height: 1.8;
        }
        .heritage-article-card details {
            padding: 0 24px 22px;
        }
        .heritage-article-card summary {
            width: fit-content;
            margin-top: 16px;
            color: #8b6b18;
            background: #fff7e8;
            border: 1px solid #eed69a;
            border-radius: 999px;
            padding: 7px 16px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }
        .heritage-article-body {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px dashed #d9e1ec;
            color: #39445a;
            font-size: 15px;
            line-height: 2;
        }
        .heritage-article-body p {
            margin: 0 0 15px;
        }
        .heritage-article-body .article-heading {
            margin-top: 22px;
            color: #8b6b18;
            font-weight: 700;
            font-size: 17px;
        }
        .instrument-archive-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }
        .instrument-archive-card {
            position: relative;
            min-height: 150px;
            padding: 18px;
            border-radius: 18px;
            border: 1px solid #e1e6ef;
            background:
                radial-gradient(circle at right top, rgba(212,175,55,0.13), transparent 42%),
                #ffffff;
            box-shadow: 0 12px 30px rgba(31,41,55,0.05);
        }
        .instrument-archive-card .family {
            display: inline-flex;
            color: #8b6b18;
            background: #fff7e8;
            border: 1px solid #eed69a;
            border-radius: 999px;
            padding: 2px 9px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .instrument-archive-card h3 {
            margin: 0 0 8px;
            color: #1f2937;
            font-size: 18px;
        }
        .instrument-archive-card p {
            margin: 0;
            color: #667085;
            font-size: 13px;
            line-height: 1.7;
        }
        @media (max-width: 760px) {
            .archive-hero {
                grid-template-columns: 1fr;
                padding: 24px;
            }
            .archive-stats {
                grid-template-columns: repeat(3, 1fr);
            }
            .archive-grid,
            .instrument-archive-grid,
            .heritage-feature,
            .heritage-person-grid {
                grid-template-columns: 1fr;
            }
        }
        /* 音频解锁提示 */
        #audioUnlockBanner {
            position: fixed;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            background: rgba(212,175,55,0.15);
            border: 1px solid #d4af37;
            color: #d4af37;
            font-size: 14px;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 10px 28px;
            border-radius: 24px;
            letter-spacing: 2px;
            backdrop-filter: blur(6px);
            cursor: pointer;
            transition: opacity 0.5s;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 8px rgba(212,175,55,0.3); }
            50% { box-shadow: 0 0 20px rgba(212,175,55,0.7); }
        }
        #audioUnlockBanner.hidden { opacity: 0; pointer-events: none; }

        #page-splash {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 32%, rgba(212,175,55,0.13), rgba(212,175,55,0) 34%),
                linear-gradient(180deg, #ffffff 0%, #f7f9fc 58%, #eef2f7 100%);
            color: #182230;
            transition: opacity 0.55s ease, visibility 0.55s ease;
        }
        #page-splash.splash-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-center {
            width: min(900px, calc(100vw - 48px));
            text-align: center;
            transform: translateY(-8px);
        }
        .splash-title {
            font-family: "Songti SC", "STSong", serif;
            font-size: 76px;
            line-height: 1;
            letter-spacing: 0;
            color: #1f2937;
            text-shadow: 0 14px 36px rgba(31,41,55,0.13);
            animation: splashRise 1s cubic-bezier(.2,.8,.2,1) 0.15s both;
        }
        .splash-baseline {
            margin-top: 20px;
            font-size: 20px;
            letter-spacing: 0;
            color: #9b7416;
            animation: splashRise 1s cubic-bezier(.2,.8,.2,1) 0.7s both;
        }
        .splash-experience {
            margin-top: 40px;
            font-size: 16px;
            letter-spacing: 0;
            color: #667085;
            animation: splashRise 1s cubic-bezier(.2,.8,.2,1) 1.25s both;
        }
        .splash-headphone {
            position: relative;
            width: 150px;
            height: 132px;
            margin: 22px auto 0;
            animation: splashRise 1s cubic-bezier(.2,.8,.2,1) 1.7s both;
        }
        .splash-headphone::before {
            content: "";
            position: absolute;
            left: 28px;
            top: 4px;
            width: 78px;
            height: 84px;
            border: 8px solid #d7b85f;
            border-bottom: 0;
            border-radius: 88px 88px 0 0;
        }
        .splash-headphone::after {
            content: "";
            position: absolute;
            left: 20px;
            top: 76px;
            width: 28px;
            height: 50px;
            border-radius: 18px;
            background: #d7b85f;
            box-shadow: 82px 0 0 #d7b85f;
        }
        .splash-start {
            margin-top: 34px;
            border: 1px solid rgba(215,184,95,0.8);
            background: #d7b85f;
            color: #111827;
            font-size: 16px;
            font-family: "Microsoft YaHei", sans-serif;
            letter-spacing: 0;
            padding: 12px 30px;
            border-radius: 28px;
            cursor: pointer;

    function unlockAudio() {
        // 解锁浏览器音频自动播放限制

    function applySongConfig(songId) {

        MASTER_LOOP_DURATION = Math.max(...Object.values(AUDIO_DURATION));

    }

    function selectSong(songId) {

    function stopCurrentMix() {
        cancelBonusMode(false);
        silenceAllSlotAudio();
        stopClock();
        gTime = 0;
        lastLoopIndex = 0;
        input.isDown = false;
        input.dragItem = null;
        input.dragSource = null;
        bonusVisualProgress = 0;
        bonusLastCount = 0;
        bonusBump = 0;
    }

    function startClock() {
        if (gRunning) return;
        gRunning = true; gPaused = false;
        gLastTs = performance.now();
        lastLoopIndex = Math.floor(gTime / MASTER_LOOP_DURATION);
        tickClock();
    }
    function tickClock() {
        if (!gRunning) return;
        const now = performance.now();
        if (!gPaused) {
            gTime += (now - gLastTs) / 1000;
            const loopIndex = Math.floor(gTime / MASTER_LOOP_DURATION);
            activateReadySlots();
            updateBonusPlaybackState();
            if (loopIndex !== lastLoopIndex) {
                lastLoopIndex = loopIndex;
                if (!bonusSongPlaying) syncAllSlotAudio(true);
            } else if (!bonusSongPlaying) {
                syncAllSlotAudio(false);
            }
        }
        gLastTs = now;
        gRafId = requestAnimationFrame(tickClock);
    }
    function stopClock() {
        gRunning = false; gPaused = false;
        if (gRafId) { cancelAnimationFrame(gRafId); gRafId = null; }
    }

    function getLoopTime() {
        if (!MASTER_LOOP_DURATION) return 0;
        return gTime % MASTER_LOOP_DURATION;
    }

    function getNextEntryLoopTime() {
        const loopTime = getLoopTime();
        const nextSegment = Math.ceil((loopTime + 0.001) / ENTRY_SEGMENT_DURATION) * ENTRY_SEGMENT_DURATION;
        return nextSegment >= MASTER_LOOP_DURATION ? 0 : nextSegment;
    }

    function getWaitProgress(slot) {
        if (!slot || !slot.waiting) return 1;
        const duration = Math.max(0.001, slot.waitEndTime - slot.waitStartTime);
        return Math.max(0, Math.min(1, (gTime - slot.waitStartTime) / duration));
    }

    function getBonusWaitProgress() {
        if (!bonusPending) return 0;
        const duration = Math.max(0.001, bonusWaitEndTime - bonusWaitStartTime);
        return Math.max(0, Math.min(1, (gTime - bonusWaitStartTime) / duration));
    }

    function getBonusTrackDuration() {
        if (bonusSongAudio && Number.isFinite(bonusSongAudio.duration) && bonusSongAudio.duration > 0) {
            return bonusSongAudio.duration;
        }
        return BONUS_TRACK_DURATION;
    }

    function getBonusTrackProgress() {
        if (!bonusSongPlaying) return 0;
        const duration = Math.max(0.001, getBonusTrackDuration());
        if (bonusSongAudio && Number.isFinite(bonusSongAudio.currentTime)) {
            return Math.max(0, Math.min(1, bonusSongAudio.currentTime / duration));
        }
        return Math.max(0, Math.min(1, ((performance.now() - bonusSongStartPerf) / 1000) / duration));
    }

    function isBonusReady() {
        return getBonusActiveCount() >= TRACK_COUNT;
    }

    function isBonusClickable() {
        return !!BONUS_TRACK_SRC && isBonusReady() && !bonusPending && !bonusSongPlaying;
    }

    function isBonusModeActive() {
        return bonusPending || bonusSongPlaying || !!bonusSongAudio;
    }

    function isBonusCircleHit(pos) {
        const dx = pos.x - BONUS_CIRCLE.x;
        const dy = pos.y - BONUS_CIRCLE.y;
        return Math.sqrt(dx * dx + dy * dy) <= BONUS_CIRCLE.outerRadius + 12;
    }

    function isLoopButtonHit(pos) {
        const dx = pos.x - LOOP_PROGRESS_BUTTON.x;
        const dy = pos.y - LOOP_PROGRESS_BUTTON.y;
        return Math.sqrt(dx * dx + dy * dy) <= LOOP_PROGRESS_BUTTON.radius;
    }

    function requestBonusPlayback() {
        if (!isBonusClickable()) return false;
        unlockAudio();
        if (!gRunning) startClock();
        const loopTime = getLoopTime();
        const triggerLoopTime = Math.max(0, MASTER_LOOP_DURATION - BONUS_PRE_ROLL_SECONDS);
        const remainingCurrentLoop = loopTime < 0.05 ? MASTER_LOOP_DURATION : MASTER_LOOP_DURATION - loopTime;
        const waitSeconds = remainingCurrentLoop + triggerLoopTime;
        const muteDelay = remainingCurrentLoop + MASTER_LOOP_DURATION;
        setActiveSlotAudioMode('normal', false);
        prepareSlotsForBonusPlayback();
        syncAllSlotAudio(false);
        resumeActiveSlotAudio();
        bonusPending = true;
        bonusWaitStartTime = gTime;
        bonusWaitEndTime = gTime + waitSeconds;
        bonusMuteSlotsAtTime = gTime + muteDelay;
        bonusFadeLoopStartTime = gTime + remainingCurrentLoop;
        bonusFadeLoopStarted = false;
        bonusSlotsSilenced = false;
        if (waitSeconds <= 0.05) startBonusSong();
        return true;
    }

    function updateBonusPlaybackState() {
        if (bonusPending && !bonusFadeLoopStarted && gTime + 0.02 >= bonusFadeLoopStartTime) {
            bonusFadeLoopStarted = true;
            prepareSlotsForBonusPlayback();
            setActiveSlotAudioMode('bonus', true);
        }
        if (bonusPending && gTime + 0.02 >= bonusWaitEndTime) {
            startBonusSong();
        }
        if (bonusSongPlaying && !bonusSlotsSilenced && gTime + 0.02 >= bonusMuteSlotsAtTime) {
            silenceAllSlotAudio();
            bonusSlotsSilenced = true;
            startBonusVideo();
        }
        if (bonusSongPlaying && bonusSongAudio) {
            const duration = getBonusTrackDuration();
            if (bonusSongAudio.ended || bonusSongAudio.currentTime >= duration - 0.03) {
                finishBonusSong();
            }
        }
    }

    function startBonusSong() {
        if (bonusSongPlaying) return;
        bonusPending = false;
        prepareSlotsForBonusPlayback();
        if (!bonusMuteSlotsAtTime || gTime + 0.02 >= bonusMuteSlotsAtTime) {
            silenceAllSlotAudio();
            bonusSlotsSilenced = true;
            startBonusVideo();
        }

        const a = new Audio(BONUS_TRACK_SRC);
        a.loop = false;
        bonusSongAudio = a;
        bonusSongPlaying = true;
        bonusSongStartPerf = performance.now();

        const startPlay = () => {
            if (bonusSongAudio !== a) return;
            try {
                a.currentTime = 0;
                bonusSongStartPerf = performance.now();
                a.play().catch(() => {
                    if (bonusSongAudio !== a) return;
                    bonusSongPlaying = false;
                    stopBonusSongAudio();
                    resumeActiveSlotAudio();
                });
            } catch (err) {
                bonusSongPlaying = false;
                stopBonusSongAudio();
                resumeActiveSlotAudio();
            }
        };
        a.addEventListener('ended', finishBonusSong, { once: true });
        if (a.readyState >= 2) startPlay();
        else a.addEventListener('canplay', startPlay, { once: true });
        a.load();
    }

    function finishBonusSong() {
        if (!bonusSongPlaying && !bonusSongAudio) return;
        bonusPending = false;
        bonusSongPlaying = false;
        bonusMuteSlotsAtTime = 0;
        bonusSlotsSilenced = false;
        bonusFadeLoopStartTime = 0;
        bonusFadeLoopStarted = false;
        stopBonusSongAudio();
        stopBonusVideo();
        setActiveSlotAudioMode('normal', false);
        restartMixFromLoopStart();
    }

    function stopBonusSongAudio() {
        if (!bonusSongAudio) return;
        bonusSongAudio.pause();
        bonusSongAudio.src = '';
        bonusSongAudio = null;
    }

    function prepareBonusVideoElement() {
        if (!bonusVideoEl) return;
        stopBonusVideo();
        bonusVideoEl.muted = true;
        bonusVideoEl.volume = 0;
        bonusVideoEl.playbackRate = BONUS_VIDEO_NORMAL_RATE;
        bonusVideoEl.playsInline = true;
        bonusVideoEl.src = BONUS_VIDEO_SRC || '';
        if (BONUS_VIDEO_SRC) bonusVideoEl.load();
    }

    function startBonusVideo() {
        if (!BONUS_VIDEO_SRC || !bonusVideoEl || !bonusVideoOverlay || bonusVideoPlaying) return;
        bonusVideoPlaying = true;
        bonusVideoEl.muted = true;
        bonusVideoEl.volume = 0;
        bonusVideoEl.playbackRate = BONUS_VIDEO_NORMAL_RATE;
        bonusVideoEl.playsInline = true;
        if (!bonusVideoEl.src) bonusVideoEl.src = BONUS_VIDEO_SRC;
        bonusVideoOverlay.classList.add('playing');
        bonusVideoOverlay.setAttribute('aria-hidden', 'false');
        bonusVideoEl.onended = () => stopBonusVideo();
        bonusVideoEl.onerror = () => stopBonusVideo();
        try {
            bonusVideoEl.currentTime = 0;
        } catch (err) {
            // Safari/Chrome may reject seeking before metadata is ready; playback still starts from the beginning after load.
        }
        startBonusVideoSlowdownMonitor();
        bonusVideoEl.play().catch(() => {
            stopBonusVideo();
        });
    }

    function startBonusVideoSlowdownMonitor() {
        stopBonusVideoSlowdownMonitor();
        const updateRate = () => {
            if (!bonusVideoPlaying || !bonusVideoEl) return;
            const duration = bonusVideoEl.duration;
            const isInEnding = Number.isFinite(duration)
                && duration > BONUS_VIDEO_END_SLOW_SECONDS
                && duration - bonusVideoEl.currentTime <= BONUS_VIDEO_END_SLOW_SECONDS;
            bonusVideoEl.playbackRate = isInEnding ? BONUS_VIDEO_END_RATE : BONUS_VIDEO_NORMAL_RATE;
            bonusVideoSlowRafId = requestAnimationFrame(updateRate);
        };
        updateRate();
    }

    function stopBonusVideoSlowdownMonitor() {
        if (!bonusVideoSlowRafId) return;
        cancelAnimationFrame(bonusVideoSlowRafId);
        bonusVideoSlowRafId = null;
    }

    function stopBonusVideo() {
        bonusVideoPlaying = false;
        stopBonusVideoSlowdownMonitor();
        if (bonusVideoOverlay) {
            bonusVideoOverlay.classList.remove('playing');
            bonusVideoOverlay.setAttribute('aria-hidden', 'true');
        }
        if (!bonusVideoEl) return;
        bonusVideoEl.pause();
        bonusVideoEl.onended = null;
        bonusVideoEl.onerror = null;
        bonusVideoEl.playbackRate = BONUS_VIDEO_NORMAL_RATE;
        try {
            bonusVideoEl.currentTime = 0;
        } catch (err) {}
    }

    function cancelBonusMode(resumeSlots = true) {
        const wasActive = isBonusModeActive();
        if (!wasActive) return false;
        bonusPending = false;
        bonusWaitStartTime = 0;
        bonusWaitEndTime = 0;
        bonusSongPlaying = false;
        bonusMuteSlotsAtTime = 0;
        bonusSlotsSilenced = false;
        bonusFadeLoopStartTime = 0;
        bonusFadeLoopStarted = false;
        stopBonusSongAudio();
        stopBonusVideo();
        setActiveSlotAudioMode('normal', resumeSlots);
        if (resumeSlots) resumeActiveSlotAudio();
        return true;
    }

    function silenceAllSlotAudio() {
        slotAudio.forEach((a, index) => {
            if (!a) return;
            a.pause();
            a.src = '';
            slotAudio[index] = null;
        });
    }

    function setActiveSlotAudioMode(mode, restartActive = false) {
        const nextMode = mode === 'bonus' ? 'bonus' : 'normal';
        const nextSource = nextMode === 'bonus' ? BONUS_AUDIO_SRC : NORMAL_AUDIO_SRC;
        const changed = activeSlotAudioMode !== nextMode || AUDIO_SRC !== nextSource;
        activeSlotAudioMode = nextMode;
        AUDIO_SRC = nextSource;
        if (restartActive && changed) restartActiveSlotAudio();
    }

    function restartActiveSlotAudio() {
        slots.forEach((slot, index) => {
            if (!slot.data || slot.paused || slot.waiting) return;
            playSlotAudio(index, slot.data.id, false);
        });
    }

    function resumeActiveSlotAudio() {
        if (!slots.some(slot => slot.data && !slot.paused && !slot.waiting)) return;
        if (!gRunning) startClock();
        slots.forEach((slot, index) => {
            if (!slot.data || slot.paused || slot.waiting) return;
            if (slotAudio[index]) {
                seekAndPlayAudio(slotAudio[index], slot.data.id, false);
            } else {
                playSlotAudio(index, slot.data.id, false);
            }
        });
    }

    function clearSlotHoldState(slot) {
        slot.paused = false;
        slot.waiting = false;
        slot.waitStartTime = 0;
        slot.waitEndTime = 0;
    }

    function prepareSlotsForBonusPlayback() {
        slots.forEach(slot => {
            if (!slot.data) return;
            clearSlotHoldState(slot);
        });
    }

    function restartMixFromLoopStart() {
        silenceAllSlotAudio();
        setActiveSlotAudioMode('normal', false);
        slots.forEach(slot => {
            if (!slot.data) return;
            clearSlotHoldState(slot);
        });
        gTime = 0;
        lastLoopIndex = 0;
        gLastTs = performance.now();
        if (!gRunning) startClock();
        resumeActiveSlotAudio();
    }

    function hasPlayingInstrument(excludeSlotIdx = null) {
        return slots.some((slot, index) => index !== excludeSlotIdx && slot.data && !slot.paused && !slot.waiting);
    }

    function seekAndPlayAudio(a, instId, restart = false) {
        const duration = AUDIO_DURATION[instId] || a.duration || MASTER_LOOP_DURATION;
        const loopTime = getLoopTime();
        try {
            if (loopTime >= duration) {
                a.pause();
                a.currentTime = Math.max(0, duration - 0.001);
                return;
            }
            if (restart || Math.abs(a.currentTime - loopTime) > 0.08 || a.paused) {
                a.currentTime = Math.min(loopTime, duration - 0.001);
            }
            a.play().catch(() => {});
        } catch (err) {
            a.addEventListener('canplay', () => seekAndPlayAudio(a, instId, restart), { once: true });
        }
    }

    function syncAllSlotAudio(restart = false) {
        slots.forEach((slot, index) => {
            const a = slotAudio[index];
            if (!slot.data || slot.paused || slot.waiting || !a) return;
            seekAndPlayAudio(a, slot.data.id, restart);
        });
    }

    function activateReadySlots() {
        if (bonusSongPlaying) return;
        slots.forEach((slot, index) => {
            if (!slot.data || !slot.waiting) return;
            if (gTime + 0.02 < slot.waitEndTime) return;
            slot.waiting = false;
            slot.paused = false;
            playSlotAudio(index, slot.data.id, false);
        });
    }

    // 放入乐器时启动音频
    function playSlotAudio(slotIdx, instId, resetIfAlone = true) {
        stopSlotAudio(slotIdx);
        if (resetIfAlone && !hasPlayingInstrument(slotIdx)) gTime = 0;
        if (!gRunning) startClock();
        const src = AUDIO_SRC[instId];
        if (!src) return;
        const a = new Audio(src);
        a.loop = false;
        const startPlay = () => {
            seekAndPlayAudio(a, instId, false);
        };
        if (a.readyState >= 2) { startPlay(); }
        else { a.addEventListener('canplay', startPlay, { once: true }); }
        slotAudio[slotIdx] = a;
    }

    function scheduleSlotEntry(slotIdx) {
        const slot = slots[slotIdx];
        if (!slot || !slot.data) return;
        const targetLoopTime = getNextEntryLoopTime();
        const loopTime = getLoopTime();
        let waitSeconds = targetLoopTime > loopTime
            ? targetLoopTime - loopTime
            : MASTER_LOOP_DURATION - loopTime + targetLoopTime;
        if (waitSeconds < 0.05) waitSeconds = ENTRY_SEGMENT_DURATION;
        slot.waiting = true;
        slot.waitStartTime = gTime;
        slot.waitEndTime = gTime + waitSeconds;
        if (!gRunning) startClock();
    }

    // 移除乐器时停止音频
    function stopSlotAudio(slotIdx) {
        const a = slotAudio[slotIdx];
        if (a) { a.pause(); a.src = ''; slotAudio[slotIdx] = null; }
        if (slots.length > 0 && slots.every(s => !s.data)) {
            stopClock();
            gTime = 0;
            lastLoopIndex = 0;
        }
    }

    // 暂停/继续单个槽位音频
    function toggleSlotAudio(slotIdx, paused) {
        const slot = slots[slotIdx];
        const a = slotAudio[slotIdx];
        if (!slot || !slot.data) return;
        if (paused) {
            if (a) a.pause();
        } else {
            if (!hasPlayingInstrument(slotIdx)) gTime = 0;
            if (!gRunning) startClock();
            if (a) {
                seekAndPlayAudio(a, slot.data.id, false);
            } else {
                playSlotAudio(slotIdx, slot.data.id, false);
            }
        }
    }

    // --- 槽位操作复用 ---
    function placeInstrumentToSlot(slotIdx, instData) {
        const slot = slots[slotIdx];
        if (!slot || !instData) return false;
        const wasBonusActive = cancelBonusMode(false);
        const hadPlayingBefore = hasPlayingInstrument();
        slot.data = instData;
        slot.paused = false;
        slot.waiting = false;
        slot.waitStartTime = 0;
        slot.waitEndTime = 0;
        if (hadPlayingBefore) {
            scheduleSlotEntry(slotIdx);
        } else {
            playSlotAudio(slotIdx, instData.id, true);
        }
        for (let k = 0; k < 20; k++) {
            createParticle(slot.x + slot.w / 2, slot.y + slot.h / 2, instData.color, -2);
        }
        if (wasBonusActive) resumeActiveSlotAudio();
        return true;
    }

    function moveInstrumentToSlot(fromIdx, toIdx) {
        if (fromIdx === toIdx) return false;
        const fromSlot = slots[fromIdx];
        const toSlot = slots[toIdx];
        if (!fromSlot || !toSlot || !fromSlot.data) return false;

        const wasBonusActive = cancelBonusMode(false);
        const instData = fromSlot.data;
        stopSlotAudio(fromIdx);
        toSlot.data = instData;
        toSlot.paused = false;
        toSlot.waiting = fromSlot.waiting;
        toSlot.waitStartTime = fromSlot.waitStartTime || 0;
        toSlot.waitEndTime = fromSlot.waitEndTime || 0;
        fromSlot.data = null;
        fromSlot.paused = false;
        fromSlot.waiting = false;
        fromSlot.waitStartTime = 0;
        fromSlot.waitEndTime = 0;
        if (toSlot.waiting) {
            slotAudio[toIdx] = null;
        } else {
            playSlotAudio(toIdx, instData.id, false);
        }
        if (wasBonusActive) resumeActiveSlotAudio();
        return true;
    }

    function removeInstrumentFromSlot(slotIdx, particleX, particleY) {
        const slot = slots[slotIdx];
        if (!slot || !slot.data) return false;
        const wasBonusActive = cancelBonusMode(false);
        slot.data = null;
        slot.paused = false;
        slot.waiting = false;
        slot.waitStartTime = 0;
        slot.waitEndTime = 0;
        stopSlotAudio(slotIdx);
        const px = particleX !== undefined ? particleX : (slot.x + slot.w / 2);
        const py = particleY !== undefined ? particleY : (slot.y + slot.h / 2);
        for (let k = 0; k < 15; k++) createParticle(px, py, "#888", 1);
        if (wasBonusActive) resumeActiveSlotAudio();
        return true;
    }

    function toggleSlotPauseState(slotIdx) {
        const slot = slots[slotIdx];
        if (!slot || !slot.data) return false;
        if (slot.waiting) return true;
        const wasBonusActive = cancelBonusMode(false);
        slot.paused = !slot.paused;
        if (!slot.paused) slot.waiting = false;
        toggleSlotAudio(slotIdx, slot.paused);
        if (slot.paused && !hasPlayingInstrument()) {
            stopClock();
            gTime = 0;
            lastLoopIndex = 0;
        }
        if (wasBonusActive) resumeActiveSlotAudio();
        return true;
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        applySongConfig(activeSongId);
        loadInstrumentImages();
        initGame();
    }

    function loadInstrumentImages() {
        instrumentImages = {};
        spriteFrames = {};
        spriteBoundsCache = new WeakMap();
        spriteSourceBounds = {};
        Object.entries(ICON_SRC).forEach(([instId, src]) => {
            const img = new Image();
            img.onload = () => { instrumentImages[instId] = img; };
            img.onerror = () => { console.warn(`Failed to load instrument icon: ${src}`); };
            img.src = src;
        });
        Object.entries(SPRITE_FRAME_FILES).forEach(([instId, files]) => {
            spriteFrames[instId] = files.map(src => {
                const img = new Image();
                img.onerror = () => { console.warn(`Failed to load ${instId} frame: ${src}`); };
                img.src = src;
                return img;
            });
        });
    }

    function pushDockGroup(ids, startX, y, itemW, itemH, itemGap) {
        ids.forEach((instId, index) => {
            const itemX = startX + index * (itemW + itemGap);
            dockItems.push({
                x: itemX,
                y,
                w: itemW,
                h: itemH,
                data: INSTRUMENT_MAP[instId],
                baseX: itemX,
                baseY: y
            });
        });
    }

    function initGame() {
        slots = [];
        dockItems = [];
        slotAudio = new Array(TRACK_COUNT).fill(null);

        const slotW = 146;
        const slotH = 338;
        const slotGap = 24;
        const slotY = 146;
        const totalW = TRACK_COUNT * slotW + (TRACK_COUNT - 1) * slotGap;
        const startX = (CONFIG.width - totalW) / 2;

        for (let i = 0; i < TRACK_COUNT; i++) {
            slots.push({
                x: startX + i * (slotW + slotGap),
                y: slotY,
                w: slotW,
                h: slotH,
                data: null,
                paused: false,
                waiting: false,
                waitStartTime: 0,
                waitEndTime: 0
            });
        }

        const itemW = 106;
        const itemH = 112;
        const itemGap = 28;
        const clusterGap = 0;
        const rowY = [586];

        DOCK_ROWS.forEach((row, rowIndex) => {
            const groupWidth = ids => ids.length ? ids.length * itemW + (ids.length - 1) * itemGap : 0;
            const leftWidth = groupWidth(row.left);
            const rightWidth = groupWidth(row.right);
            const activeClusterGap = leftWidth && rightWidth ? clusterGap : 0;
            const rowWidth = leftWidth + activeClusterGap + rightWidth;
            const startRowX = (CONFIG.width - rowWidth) / 2;
            pushDockGroup(row.left, startRowX, rowY[rowIndex], itemW, itemH, itemGap);
            pushDockGroup(row.right, startRowX + leftWidth + activeClusterGap, rowY[rowIndex], itemW, itemH, itemGap);
        });

        loadingDiv.style.display = 'none';
        if (!loopStarted) {
            loopStarted = true;
            loop();
        }
    }

    function resize() {
        let aspect = CONFIG.width / CONFIG.height;
        let windowAspect = window.innerWidth / window.innerHeight;
        let scale;
        if (windowAspect < aspect) scale = window.innerWidth / CONFIG.width;
        else scale = window.innerHeight / CONFIG.height;

        const dpr = Math.min(1.5, Math.max(1, window.devicePixelRatio || 1));
        const cssW = CONFIG.width * scale;
        const cssH = CONFIG.height * scale;

        canvas.style.width = `${cssW}px`;
        canvas.style.height = `${cssH}px`;
        canvas.width = Math.round(CONFIG.width * dpr);
        canvas.height = Math.round(CONFIG.height * dpr);

        // 逻辑坐标仍以 CONFIG 为准，内部按 DPR 放大渲染，避免高清素材发糊
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'medium';
    }

    function update() {
        time += 0.015;
        updateBonusCircleState();

// 粒子更新
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.y -= p.speed;
            p.x += Math.sin(time * 2 + p.seed) * 0.5;
            p.life--;
            p.alpha = p.life / 60;
            if (p.life <= 0) particles.splice(i, 1);
        }

        if (Math.random() < 0.2) {
            createParticle(Math.random() * CONFIG.width, CONFIG.height, 'rgba(255,255,255,0.1)', 0.5);
        }
    }

    function updateBonusCircleState() {
        const activeCount = getBonusActiveCount();
        const target = activeCount / TRACK_COUNT;
        if (activeCount !== bonusLastCount) {
            const increased = activeCount > bonusLastCount;
            bonusBump = increased ? 1 : 0;
            bonusLastCount = activeCount;
            if (increased) {
                for (let i = 0; i < 10; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = BONUS_CIRCLE.outerRadius * (0.55 + Math.random() * 0.55);
                    createParticle(
                        BONUS_CIRCLE.x + Math.cos(angle) * dist,
                        BONUS_CIRCLE.y + Math.sin(angle) * dist,
                        activeCount >= TRACK_COUNT ? 'rgba(53,191,99,0.8)' : 'rgba(140,224,130,0.65)',
                        0.8
                    );
                }
            }
        }
        bonusVisualProgress += (target - bonusVisualProgress) * 0.13;
        if (Math.abs(target - bonusVisualProgress) < 0.002) bonusVisualProgress = target;
        bonusBump *= 0.86;
    }

    function draw() {
        ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);

// 1. 标题区
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "bold 32px serif";
        ctx.letterSpacing = "14px";
        ctx.shadowBlur = 16;
        ctx.shadowColor = "rgba(212,175,55,0.18)";
        ctx.fillStyle = CONFIG.colors.gold;
        ctx.fillText("赤 峰 雅 乐", CONFIG.width / 2, 88);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(212,175,55,0.18)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(CONFIG.width / 2 - 118, 113);
        ctx.lineTo(CONFIG.width / 2 + 118, 113);
        ctx.stroke();
        ctx.letterSpacing = "0px";
        ctx.textBaseline = "alphabetic";
        ctx.restore();
        drawBonusCircle(ctx);
        drawBonusWaitBar(ctx);
        drawSongSwitcher(ctx);
        drawLoopProgress(ctx);

// 2. 绘制插槽 (Stage)
        slots.forEach((slot, index) => {
            let isActive = slot.data !== null;
            let isPaused = slot.paused;
            drawAncientPillar(ctx, slot.x, slot.y, slot.w, slot.h, index, slot.data, isPaused, slot.waiting);

            if (isActive) {
                if (input.dragSource === index && input.dragItem) ctx.globalAlpha = 0.26;
                drawStageInstrument(ctx, slot);
                ctx.globalAlpha = 1.0;
            }
        });
        drawBonusTrackProgress(ctx);

// 3. 粒子特效
        ctx.globalCompositeOperation = 'lighter';
        particles.forEach(p => {
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1.0;

// 4. 底部 Dock
        drawDock();

// 5. 拖拽物
        if (input.isDown && input.dragItem) {
            drawStoneIcon(ctx, input.x - 52, input.y - 52, 104, 104, input.dragItem.color, input.dragItem.id, true, false, false);
        }
    }

    // --- 图形绘制逻辑 ---

    function drawLoopProgress(ctx) {
        const cx = LOOP_PROGRESS_BUTTON.x;
        const cy = LOOP_PROGRESS_BUTTON.y;
        const radius = 34;
        const progress = MASTER_LOOP_DURATION ? getLoopTime() / MASTER_LOOP_DURATION : 0;
        const loopTime = getLoopTime();
        const cancelMode = isBonusModeActive();
        const hover = cancelMode && isLoopButtonHit(input);

        ctx.save();
        ctx.fillStyle = cancelMode ? 'rgba(255,248,248,0.92)' : 'rgba(255,255,255,0.82)';
        ctx.strokeStyle = cancelMode ? 'rgba(200,93,79,0.5)' : 'rgba(212,175,55,0.36)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(cx, cy, radius + 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = cancelMode ? 'rgba(200,93,79,0.18)' : 'rgba(148,163,184,0.45)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = cancelMode ? (hover ? '#b63e34' : '#c85d4f') : CONFIG.colors.gold;
        ctx.lineCap = 'round';
        ctx.lineWidth = cancelMode && hover ? 7 : 6;
        ctx.beginPath();
        if (cancelMode) {
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        } else {
            ctx.arc(cx, cy, radius, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
        }
        ctx.stroke();

        ctx.textAlign = 'center';
        if (cancelMode) {
            ctx.fillStyle = hover ? '#9f2f25' : '#c85d4f';
            ctx.font = 'bold 24px "Microsoft YaHei", sans-serif';
            ctx.fillText('×', cx, cy + 8);
        } else {
            ctx.fillStyle = '#1f2937';
            ctx.font = '13px "Microsoft YaHei", sans-serif';
            ctx.fillText(`${Math.floor(loopTime).toString().padStart(2, '0')}s`, cx, cy + 4);
        }
        ctx.restore();
    }

    function drawSongSwitcher(ctx) {
        const songs = Object.values(SONG_CONFIGS);
        const buttonW = (SONG_SWITCH.w - SONG_SWITCH.gap) / songs.length;
        ctx.save();
        ctx.font = '13px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        songs.forEach((song, index) => {
            const x = SONG_SWITCH.x + index * (buttonW + SONG_SWITCH.gap);
            const y = SONG_SWITCH.y;
            const active = song.id === activeSongId;
            ctx.shadowColor = active ? 'rgba(139,107,24,0.18)' : 'rgba(31,41,55,0.06)';
            ctx.shadowBlur = active ? 12 : 6;
            ctx.fillStyle = active ? '#4a2f00' : 'rgba(255,255,255,0.86)';
            ctx.strokeStyle = active ? CONFIG.colors.gold : 'rgba(203,213,225,0.95)';
            ctx.lineWidth = active ? 1.5 : 1;
            ctx.beginPath();
            ctx.roundRect(x, y, buttonW, SONG_SWITCH.h, 19);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = active ? '#f5cf5d' : '#667085';
            ctx.fillText(song.switchLabel, x + buttonW / 2, y + 22);
        });
        ctx.restore();
    }

    function getSongSwitchHit(pos) {
        const songs = Object.values(SONG_CONFIGS);
        const buttonW = (SONG_SWITCH.w - SONG_SWITCH.gap) / songs.length;
        for (let i = 0; i < songs.length; i++) {
            const rect = {
                x: SONG_SWITCH.x + i * (buttonW + SONG_SWITCH.gap),
                y: SONG_SWITCH.y,
                w: buttonW,
                h: SONG_SWITCH.h
            };
            if (isInside(pos, rect)) return songs[i].id;
        }
        return null;
    }

    function drawBonusCircle(ctx) {
        const activeCount = getBonusActiveCount();
        const complete = activeCount >= TRACK_COUNT && bonusVisualProgress > 0.985;
        const clickable = isBonusClickable();
        const hover = clickable && isBonusCircleHit(input);
        const pulse = complete
            ? 1 + Math.sin(time * 4.2) * (hover ? 0.085 : 0.055) + (hover ? 0.06 : 0)
            : 1 + bonusBump * 0.16;
        const cx = BONUS_CIRCLE.x;
        const cy = BONUS_CIRCLE.y;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(pulse, pulse);
        drawBonusPopRing(ctx, bonusBump);
        if (clickable) drawBonusReadyEffect(ctx, hover);

        if (complete) {
            ctx.shadowColor = 'rgba(53,191,99,0.34)';
            ctx.shadowBlur = 26 + Math.sin(time * 4.2) * 8;
            const fullGrad = ctx.createRadialGradient(-12, -14, 4, 0, 0, BONUS_CIRCLE.radius + 10);
            fullGrad.addColorStop(0, '#70ec99');
            fullGrad.addColorStop(0.62, '#35bf63');
            fullGrad.addColorStop(1, '#269c51');
            ctx.fillStyle = fullGrad;
            ctx.beginPath();
            ctx.arc(0, 0, BONUS_CIRCLE.radius + 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.beginPath();
            ctx.arc(-10, -12, 8, 0, Math.PI * 2);
            ctx.fill();
            drawBonusMicIcon(ctx, 0, 0, 0.9, '#ffffff', '#35bf63');
            ctx.restore();
            if (clickable) drawBonusReadyHint(ctx, cx, cy, hover);
            return;
        }

        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.beginPath();
        ctx.arc(0, 0, BONUS_CIRCLE.outerRadius - 8, 0, Math.PI * 2);
        ctx.fill();

        const idleGrad = ctx.createRadialGradient(-8, -11, 4, 0, 0, 24);
        idleGrad.addColorStop(0, '#95a4b8');
        idleGrad.addColorStop(1, '#5f6f84');
        ctx.fillStyle = idleGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fill();

        drawBonusSegments(ctx, 28, 8, Math.max(0, Math.min(1, bonusVisualProgress)));
        drawBonusMicIcon(ctx, 0, 0, 0.68, '#ffffff', '#607085');

        ctx.restore();
    }

    function drawBonusReadyEffect(ctx, hover) {
        const alpha = hover ? 0.56 : 0.36;
        const ringPulse = (Math.sin(time * 5.5) + 1) / 2;
        ctx.save();
        ctx.globalAlpha = alpha * (0.72 + ringPulse * 0.28);
        ctx.strokeStyle = '#35bf63';
        ctx.lineWidth = hover ? 3 : 2;
        ctx.beginPath();
        ctx.arc(0, 0, BONUS_CIRCLE.outerRadius + 3 + ringPulse * 5, 0, Math.PI * 2);
        ctx.stroke();

        ctx.globalAlpha = hover ? 0.8 : 0.55;
        ctx.strokeStyle = 'rgba(112,236,153,0.95)';
        ctx.setLineDash([3, 7]);
        ctx.lineDashOffset = -time * 42;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, BONUS_CIRCLE.outerRadius + 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        for (let i = 0; i < 6; i++) {
            const angle = time * 1.7 + i * Math.PI / 3;
            const r = BONUS_CIRCLE.outerRadius + 7 + Math.sin(time * 3 + i) * 2;
            ctx.globalAlpha = hover ? 0.82 : 0.52;
            ctx.fillStyle = '#70ec99';
            ctx.beginPath();
            ctx.arc(Math.cos(angle) * r, Math.sin(angle) * r, hover ? 2.2 : 1.7, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function drawBonusReadyHint(ctx, cx, cy, hover) {
        const label = '点击播放';
        const w = hover ? 62 : 56;
        const h = 18;
        const x = cx - w / 2;
        const y = cy + BONUS_CIRCLE.outerRadius + 8;
        ctx.save();
        ctx.globalAlpha = hover ? 1 : 0.84 + Math.sin(time * 4.2) * 0.12;
        ctx.shadowColor = 'rgba(53,191,99,0.2)';
        ctx.shadowBlur = hover ? 14 : 9;
        ctx.fillStyle = hover ? '#269c51' : 'rgba(53,191,99,0.92)';
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, h / 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = '10px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(label, cx, y + 13);
        ctx.restore();
    }

    function drawBonusPopRing(ctx, strength) {
        if (strength <= 0.035) return;
        const expansion = (1 - strength) * 18;
        ctx.save();
        ctx.globalAlpha = Math.min(0.9, strength);
        ctx.strokeStyle = BONUS_CIRCLE.dashColor;
        ctx.lineWidth = 4;
        ctx.setLineDash([7, 6]);

        ctx.beginPath();
        ctx.arc(0, 0, BONUS_CIRCLE.outerRadius + expansion, 0, Math.PI * 2);

        ctx.restore();
    }

    function drawBonusSegments(ctx, radius, lineWidth, progress) {

    function getBonusActiveCount() {

    // --- 图形绘制逻辑 ---

    function drawAncientPillar(ctx, x, y, w, h, index, data = null, isPaused = false, isWaiting = false) {
        const cx = x + w / 2;
        const accent = data ? data.color : '#d9e0ea';

        ctx.save();

        innerGrad.addColorStop(1, 'rgba(239,244,250,0.9)');
        ctx.fillStyle = innerGrad;
        ctx.beginPath();
        ctx.roundRect(innerX, innerY, innerW, innerH, 16);

        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = data ? accent : '#cfd8e3';

        ctx.fillStyle = '#94a3b8';
        ctx.font = '13px "Microsoft YaHei", sans-serif';
        ctx.fillText('拖拽乐器', cx, y + h - 56);
        ctx.font = '12px "Microsoft YaHei", sans-serif';
        ctx.fillText('到这里开始演奏', cx, y + h - 36);
    }

    function drawStageInstrument(ctx, slot) {
        const { data, paused } = slot;
        if (!data) return;

        const bonusActive = isBonusModeActive();
        const muted = !bonusActive && (paused || slot.waiting);
        const accent = muted ? '#a8b2c4' : data.color;
        const circleX = slot.x + slot.w / 2;
        const circleY = slot.y + 126;

        if (drawInstrumentSprite(ctx, slot, data.id, { muted, firstFrame: muted })) {
            // 精灵动画优先；等待和暂停时显示灰色定格帧。
        } else {
            ctx.save();
            ctx.shadowColor = muted ? 'rgba(148,163,184,0.15)' : `${accent}40`;
            ctx.shadowBlur = muted ? 8 : 24;
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = accent;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(circleX, circleY, 42, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            drawInstrumentIcon(ctx, circleX, circleY, 78, data.id, muted);
            ctx.restore();
        }

        ctx.fillStyle = '#1f2937';
        ctx.font = '16px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(data.name, circleX, slot.y + slot.h - 38);
        if (slot.waiting && !bonusActive) drawWaitingProgress(ctx, circleX, slot.y + slot.h - 16, getWaitProgress(slot), data.color);
    }

    function drawKeyboardSprite(ctx, slot) {
        if (!drawInstrumentSprite(ctx, slot, 'keyboard')) {
            drawInstrumentIcon(ctx, slot.x + slot.w / 2, slot.y + 126, 78, 'keyboard', false);
        }
    }

    function drawInstrumentSprite(ctx, slot, instId, options = {}) {
        const frames = spriteFrames[instId] || [];
        const usableFrames = frames.filter(img => img && img.complete && img.naturalWidth > 0);
        if (!usableFrames.length) {
            return false;
        }
        const elapsed = ((gTime % 2) + 2) % 2;
        const frameIndex = options.firstFrame ? 0 : Math.floor((elapsed / 2) * frames.length) % frames.length;
        const frame = frames[frameIndex] && frames[frameIndex].complete ? frames[frameIndex] : usableFrames[0];
        const cfg = SPRITE_DRAW_CONFIG[instId] || SPRITE_DRAW_CONFIG.default;
        ctx.save();
        if (options.muted) {
            ctx.filter = 'grayscale(1) saturate(0.08) opacity(0.62)';
            ctx.shadowColor = 'rgba(100,116,139,0.12)';
            ctx.shadowBlur = 8;
        } else {
            ctx.shadowColor = 'rgba(89,111,168,0.25)';
            ctx.shadowBlur = 22;
        }
        const bounds = getSpriteSourceBounds(instId, usableFrames[0]);
        drawImageContentFitHeight(
            ctx,
            frame,
            bounds,
            slot.x + slot.w / 2 + cfg.offsetX,
            slot.y + cfg.top,
            cfg.height
        );
        ctx.restore();
        return true;
    }

    function getSpriteSourceBounds(instId, frame) {
        if (spriteSourceBounds[instId]) return spriteSourceBounds[instId];
        const raw = getImageAlphaBounds(frame);
        const padX = Math.round(raw.w * 0.035);
        const padY = Math.round(raw.h * 0.025);
        const bounds = {
            x: Math.max(0, raw.x - padX),
            y: Math.max(0, raw.y - padY),
            w: Math.min(frame.naturalWidth - Math.max(0, raw.x - padX), raw.w + padX * 2),
            h: Math.min(frame.naturalHeight - Math.max(0, raw.y - padY), raw.h + padY * 2)
        };
        spriteSourceBounds[instId] = bounds;
        return bounds;
    }

    function getImageAlphaBounds(img) {
        if (spriteBoundsCache.has(img)) return spriteBoundsCache.get(img);
        const fallback = { x: 0, y: 0, w: img.naturalWidth, h: img.naturalHeight };
        try {
            const scanCanvas = document.createElement('canvas');
            scanCanvas.width = img.naturalWidth;
            scanCanvas.height = img.naturalHeight;
            const scanCtx = scanCanvas.getContext('2d');
            scanCtx.drawImage(img, 0, 0);
            const { data, width, height } = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
            let minX = width;
            let minY = height;
            let maxX = -1;
            let maxY = -1;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (data[(y * width + x) * 4 + 3] > 8) {
                        if (x < minX) minX = x;
                        if (y < minY) minY = y;
                        if (x > maxX) maxX = x;
                        if (y > maxY) maxY = y;
                    }
                }
            }
            const bounds = maxX >= 0
                ? { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 }
                : fallback;
            spriteBoundsCache.set(img, bounds);
            return bounds;
        } catch (err) {
            spriteBoundsCache.set(img, fallback);
            return fallback;
        }
    }

    function drawImageContentFitHeight(ctx, img, bounds, centerX, topY, targetH) {
        const scale = targetH / bounds.h;
        const drawW = bounds.w * scale;
        ctx.drawImage(
            img,
            bounds.x,
            bounds.y,
            bounds.w,
            bounds.h,
            centerX - drawW / 2,
            topY,
            drawW,
            targetH
        );
    }

    function drawWaitingProgress(ctx, cx, cy, progress, color) {
        const radius = 13;
        ctx.save();
        ctx.strokeStyle = 'rgba(148,163,184,0.36)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(cx, cy, radius, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
        ctx.stroke();
        ctx.restore();
    }

    function drawImageContain(ctx, img, x, y, w, h) {
        const scale = Math.min(w / img.naturalWidth, h / img.naturalHeight);
        const drawW = img.naturalWidth * scale;
        const drawH = img.naturalHeight * scale;
        ctx.drawImage(img, x + (w - drawW) / 2, y + (h - drawH) / 2, drawW, drawH);
    }

    function drawImageCover(ctx, img, x, y, w, h, source = null) {
        const sx = source ? source.sx : 0;
        const sy = source ? source.sy : 0;
        const sw = source ? source.sw : img.naturalWidth;
        const sh = source ? source.sh : img.naturalHeight;
        const sourceAspect = sw / sh;
        const targetAspect = w / h;
        let cropX = sx;
        let cropY = sy;
        let cropW = sw;
        let cropH = sh;
        if (sourceAspect > targetAspect) {
            cropW = sh * targetAspect;
            cropX = sx + (sw - cropW) / 2;
        } else {
            cropH = sw / targetAspect;
            cropY = sy + (sh - cropH) / 2;
        }
        ctx.drawImage(img, cropX, cropY, cropW, cropH, x, y, w, h);
    }

    function drawMaskTotem(ctx, x, y, w, h, data, isPaused) {
        drawStageInstrument(ctx, { x, y, w, h, data, paused: isPaused });
    }

    function drawDock() {
        const dockTop = CONFIG.height - 158;
        let grad = ctx.createLinearGradient(0, dockTop, 0, CONFIG.height);
        grad.addColorStop(0, "rgba(255,255,255,0)");
        grad.addColorStop(0.32, "rgba(247,249,252,0.78)");
        grad.addColorStop(1, "rgba(235,240,247,0.98)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, dockTop, CONFIG.width, CONFIG.height - dockTop);

        ctx.strokeStyle = "rgba(186,146,44,0.85)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, dockTop + 20);
        ctx.lineTo(CONFIG.width, dockTop + 20);
        ctx.stroke();

        ctx.fillStyle = "#8b6b18";
        ctx.font = '14px "Microsoft YaHei", sans-serif';
        ctx.textAlign = "center";
        ctx.fillText("拖入音轨开始播放 · 拖回空白区域移除 · 点击原音轨可暂停", CONFIG.width / 2, dockTop + 12);

        dockItems.forEach(item => {
            if (input.dragItem === item.data && input.dragSource === 'dock') return;
            const isDisabled = isInstrumentUsed(item.data.id);
            drawStoneIcon(ctx, item.x, item.y, item.w, item.h, item.data.color, item.data.id, false, isDisabled, true);
        });
    }

    /**
     * Dock 乐器图标
     */
    function drawStoneIcon(ctx, x, y, w, h, color, id, isDragging, isDisabled = false, showLabel = true) {
        const inst = INSTRUMENT_MAP[id];
        const cx = x + w / 2;
        const cy = showLabel ? y + 44 : y + h / 2;
        const r = Math.min(w, showLabel ? 88 : w) / 2;
        const ringColor = isDisabled ? "#b8c2d1" : color;
        const topColor = isDisabled ? "#f3f5f8" : "#ffffff";
        const bottomColor = isDisabled ? "#dbe3ee" : "#edf2f8";

        if (isDragging && !isDisabled) {
            ctx.shadowColor = `${color}55`;
            ctx.shadowBlur = 24;
        }

        let grad = ctx.createLinearGradient(x, y, x, y + h);
        grad.addColorStop(0, topColor);
        grad.addColorStop(1, bottomColor);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, r - 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 1.5;
        if (!isDragging && !isDisabled) {
            ctx.shadowColor = `${color}33`;
            ctx.shadowBlur = 8;
        }
        ctx.beginPath();
        ctx.arc(cx, cy, r - 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;

        drawInstrumentIcon(ctx, cx, cy, showLabel ? 78 : 92, id, isDisabled);

        if (showLabel && inst) {
            ctx.fillStyle = isDisabled ? "#98a2b3" : "#475467";
            ctx.font = '14px "Microsoft YaHei", sans-serif';
            ctx.textAlign = "center";
            ctx.fillText(inst.name, cx, y + h - 6);
        }
    }

    function drawInstrumentIcon(ctx, cx, cy, size, id, isDisabled = false) {
        const img = instrumentImages[id];
        if (img && img.complete && img.naturalWidth > 0) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
            ctx.clip();
            if (isDisabled) {
                ctx.filter = 'grayscale(1) brightness(0.9)';
                ctx.globalAlpha = 0.72;
            }
            const drawSize = Math.round(size * 1.08);
            ctx.drawImage(img, Math.round(cx - drawSize / 2), Math.round(cy - drawSize / 2), drawSize, drawSize);
            ctx.restore();
            return;
        }

        const inst = INSTRUMENT_MAP[id];
        const shapeColor = isDisabled ? "#9aa3b2" : (inst ? inst.color : "#667085");
        ctx.save();
        ctx.fillStyle = shapeColor;
        ctx.strokeStyle = shapeColor;
        ctx.shadowColor = `${shapeColor}22`;
        ctx.shadowBlur = isDisabled ? 0 : 4;
        drawInstrumentShape(ctx, cx, cy, id, shapeColor, size / 64);
        ctx.restore();
    }

    function isInstrumentUsed(instId) {
        return slots.some(slot => slot.data && slot.data.id === instId);
    }

    /**
     * 根据乐器ID绘制具体图形
     */
    function drawInstrumentShape(ctx, cx, cy, id, color, scale = 1) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = color;
        ctx.fillStyle = color;

        const fillAccent = drawPath => {
            ctx.save();
            ctx.globalAlpha = 0.18;
            drawPath();
            ctx.fill();
            ctx.restore();
            drawPath();
            ctx.stroke();
        };

        const normalizedId = {
            china_drum: 'big_drum',
            double_bass_song2: 'double_bass',
            guzheng_song2: 'guzheng',
            bamboo_flute_song2: 'flute',
            synth_song2: 'keyboard'
        }[id] || id;

        switch (normalizedId) {
            case 'snare':
                fillAccent(() => {
                    ctx.beginPath();
                    ctx.ellipse(0, 2, 17, 10, 0, 0, Math.PI * 2);
                });
                ctx.beginPath();
                ctx.moveTo(-12, 12);
                ctx.lineTo(-15, 19);
                ctx.moveTo(12, 12);
                ctx.lineTo(15, 19);
                ctx.moveTo(-12, -13);
                ctx.lineTo(10, -20);
                ctx.moveTo(12, -13);
                ctx.lineTo(-10, -20);
                ctx.stroke();
                break;

            case 'kick':
                fillAccent(() => {
                    ctx.beginPath();
                    ctx.arc(0, 2, 17, 0, Math.PI * 2);
                });
                ctx.beginPath();
                ctx.arc(0, 2, 9, 0, Math.PI * 2);
                ctx.moveTo(-10, 17);
                ctx.lineTo(-15, 23);
                ctx.moveTo(10, 17);
                ctx.lineTo(15, 23);
                ctx.stroke();
                break;

            case 'cymbal':
                fillAccent(() => {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 18, 7, 0, 0, Math.PI * 2);
                });
                ctx.beginPath();
                ctx.moveTo(0, 7);
                ctx.lineTo(0, 22);
                ctx.moveTo(-11, 22);
                ctx.lineTo(11, 22);
                ctx.arc(0, -1, 3, 0, Math.PI * 2);
                ctx.stroke();
                break;

            case 'bass':
                fillAccent(() => {
                    ctx.beginPath();
                    ctx.moveTo(-16, 4);
                    ctx.bezierCurveTo(-13, -11, -2, -13, 3, -5);
                    ctx.bezierCurveTo(12, -8, 17, -2, 13, 8);
                    ctx.bezierCurveTo(7, 20, -12, 17, -16, 4);
                });
                ctx.beginPath();
                ctx.moveTo(9, -5);
                ctx.lineTo(22, -18);
                ctx.moveTo(12, -2);
                ctx.lineTo(24, -14);
                ctx.moveTo(-8, 0);
                ctx.lineTo(10, 7);
                ctx.stroke();
                break;

            case 'keyboard':
                ctx.fillStyle = color;
                ctx.fillRect(-20, -9, 40, 18);
                ctx.fillStyle = '#fff';
                for (let i = 0; i < 8; i++) ctx.fillRect(-18 + i * 4.5, -7, 4, 14);
                ctx.fillStyle = '#111827';
                for (let i = 0; i < 6; i++) {
                    if (i === 2) continue;
                    ctx.fillRect(-15 + i * 5.2, -7, 2.4, 8);
                }
                break;

            case 'flute':
                ctx.beginPath();
                ctx.moveTo(-22, 9);
                ctx.lineTo(18, -13);
                ctx.stroke();
                ctx.lineWidth = 1.7;
                ctx.beginPath();
                [-11, -4, 3, 10].forEach((dx, idx) => {
                    const x = dx;
                    const y = 2 - idx * 3.8;
                    ctx.moveTo(x + 2.5, y);
                    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                });
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(19, -14);
                ctx.lineTo(24, -17);
                ctx.stroke();
                break;

            case 'choir_song2':
                ctx.lineWidth = 2.4;
                fillAccent(() => {
                    ctx.beginPath();
                    ctx.arc(-9, -2, 8, 0, Math.PI * 2);
                    ctx.arc(9, -2, 8, 0, Math.PI * 2);
                    ctx.roundRect(-18, 9, 36, 15, 8);
                });
                ctx.beginPath();
                ctx.moveTo(-3, -18);
                ctx.quadraticCurveTo(9, -24, 13, -12);
                ctx.moveTo(13, -12);
                ctx.lineTo(13, 8);
                ctx.arc(9, 8, 4, 0, Math.PI * 2);
                ctx.stroke();
                break;

            case 'big_drum':
                fillAccent(() => {
                    ctx.beginPath();
                    ctx.ellipse(0, 2, 16, 11, 0, 0, Math.PI * 2);
                });
                ctx.beginPath();
                ctx.moveTo(-11, 12);
                ctx.lineTo(-14, 18);
                ctx.moveTo(11, 12);
                ctx.lineTo(14, 18);
                ctx.moveTo(-7, -11);
                ctx.lineTo(11, -17);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(13, -18, 3, 0, Math.PI * 2);
                ctx.fill();
                break;

            case 'percussion':
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-13, -11);
                ctx.lineTo(12, 12);
                ctx.moveTo(13, -11);
                ctx.lineTo(-12, 12);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(-14, -12, 2.5, 0, Math.PI * 2);
                ctx.arc(14, -12, 2.5, 0, Math.PI * 2);
                ctx.arc(-13, 13, 2.5, 0, Math.PI * 2);
                ctx.arc(13, 13, 2.5, 0, Math.PI * 2);
                ctx.fill();
                break;

            case 'gong':
                ctx.beginPath();
                ctx.moveTo(-12, -14);
                ctx.lineTo(-12, 12);
                ctx.moveTo(12, -14);
                ctx.lineTo(12, 12);
                ctx.moveTo(-12, -14);
                ctx.lineTo(12, -14);
                ctx.stroke();
                fillAccent(() => {
                    ctx.beginPath();
                    ctx.arc(0, 2, 10, 0, Math.PI * 2);
                });
                ctx.beginPath();
                ctx.moveTo(13, 4);
                ctx.lineTo(19, -1);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(20, -2, 2.5, 0, Math.PI * 2);
                ctx.fill();
                break;

            case 'double_bass':
                ctx.beginPath();
                ctx.moveTo(0, -24);
                ctx.lineTo(0, -9);
                ctx.stroke();
                fillAccent(() => {
                    ctx.beginPath();
                    ctx.moveTo(0, -12);
                    ctx.bezierCurveTo(10, -10, 12, -2, 7, 7);
                    ctx.bezierCurveTo(11, 14, 8, 20, 0, 23);
                    ctx.bezierCurveTo(-8, 20, -11, 14, -7, 7);
                    ctx.bezierCurveTo(-12, -2, -10, -10, 0, -12);
