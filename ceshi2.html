    // --- 粒子与工具 ---
    function createParticle(x, y, color, speedFn) {
        particles.push({
            x: x, y: y,
            size: Math.random() * 2,
            color: color,
            alpha: 1,
            life: 40 + Math.random() * 60,
            seed: Math.random() * 100,
            speed: (Math.random() * 1 + 0.5) * (speedFn || 1)
        });
    }

    // --- 输入处理 ---
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = CONFIG.width / rect.width;
        const scaleY = CONFIG.height / rect.height;
        let cx = e.clientX, cy = e.clientY;
        if (e.changedTouches && e.changedTouches.length) {
            cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
        }
        return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
    }

    function onDown(e) {
        const pos = getPos(e);
        input.x = pos.x; input.y = pos.y;
        input.isDown = true;
        input.dragItem = null; input.dragSource = null;
        updateCanvasCursor(pos);

        if (isBonusModeActive() && isLoopButtonHit(pos)) {
            cancelBonusMode(true);
            input.isDown = false;
            updateCanvasCursor(pos);
            return;
        }

        const selectedSongId = getSongSwitchHit(pos);
        if (selectedSongId) {
            selectSong(selectedSongId);
            input.isDown = false;
            updateCanvasCursor(pos);
            return;
        }

        if (isBonusCircleHit(pos) && requestBonusPlayback()) {
            input.isDown = false;
            updateCanvasCursor(pos);
            return;
        }

        for (let item of dockItems) {
            if (isInside(pos, item) && !isInstrumentUsed(item.data.id)) {
                input.dragItem = item.data; input.dragSource = 'dock'; return;
            }
        }
        for (let i = 0; i < slots.length; i++) {
            let slot = slots[i];
            if (slot.data && isInside(pos, slot)) {
                input.dragItem = slot.data; input.dragSource = i; return;
            }
        }
    }

    function onMove(e) {
        e.preventDefault();
        const pos = getPos(e);
        input.x = pos.x; input.y = pos.y;
        updateCanvasCursor(pos);
        if (!input.isDown) return;
    }

    function onUp(e) {
        e.preventDefault();
        const pos = getPos(e);
        input.isDown = false;

        if (input.dragItem) {
            let dropped = false;
            for (let i = 0; i < slots.length; i++) {
                let slot = slots[i];
                if (isInside(pos, slot)) {
                    if (input.dragSource === 'dock') {
                        // 从乐器区拖入：放置并播放
                        dropped = placeInstrumentToSlot(i, input.dragItem);
                    } else if (input.dragSource !== null) {
                        if (i === input.dragSource) {
                            // 点击同一槽位：切换暂停
                            dropped = toggleSlotPauseState(i);
                        } else {
                            // 拖到另一槽位：移动
                            dropped = moveInstrumentToSlot(input.dragSource, i);
                        }
                    }
                    break;
                }
            }
            if (!dropped && input.dragSource !== 'dock' && input.dragSource !== null) {
                // 拖出音轨：移除并停止音频
                removeInstrumentFromSlot(input.dragSource, input.x, input.y);
            }
        }
        input.dragItem = null; input.dragSource = null;
        updateCanvasCursor(pos);
    }

    function updateCanvasCursor(pos = input) {
        if (input.dragItem) {
            canvas.style.cursor = 'grabbing';
            return;
        }
        if ((isBonusClickable() && isBonusCircleHit(pos))
            || (isBonusModeActive() && isLoopButtonHit(pos))
            || getSongSwitchHit(pos)) {
            canvas.style.cursor = 'pointer';
            return;
        }
        if (dockItems.some(item => isInside(pos, item) && !isInstrumentUsed(item.data.id))) {
            canvas.style.cursor = 'grab';
            return;
        }
        if (slots.some(slot => slot.data && isInside(pos, slot))) {
            canvas.style.cursor = 'grab';
            return;
        }
        canvas.style.cursor = 'default';
    }

    function isInside(pos, rect) {
        return pos.x > rect.x && pos.x < rect.x + rect.w && pos.y > rect.y && pos.y < rect.y + rect.h;
    }

    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
    canvas.addEventListener('mouseleave', () => { canvas.style.cursor = 'default'; });
    canvas.addEventListener('touchstart', onDown, {passive: false});
    canvas.addEventListener('touchmove', onMove, {passive: false});
    canvas.addEventListener('touchend', onUp, {passive: false});

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

                    "body": "我的赤峰雅乐传承之路\n张景瑞\n雅乐是古代宫廷祭祀天地祖先和朝贺宴飨等大典所用的音乐。雅乐作为宫廷音乐，随清朝统治的衰落，宫廷音乐逐渐流入民间。雅乐流入赤峰地区的时间，据红山文史记载：大约在光绪初年（1875年前后），当时元宝山矿主和清末秀才等人组织雅乐会，研习演奏雅乐，开始在庙会、节日社庆活动中演奏。雅乐曲调中正平和，典雅纯正，百年来深受群众喜爱。后来由于经历多次战乱和受文革“破四旧”的影响，无人再敢整理和演奏赤峰雅乐，雅乐频于失传。\n1982年，原赤峰市委、市人民政府成立乐抢救小组，对赤峰雅乐进行抢救性的挖掘整理。红山区文化馆的音乐工作者组织当时健在的赤峰雅乐艺人，通过回忆、查找现存乐谱，挖掘出赤峰雅乐短曲24首，并把原雅乐的工尺谱译成简谱。组织赤峰雅乐艺人、文化馆的音乐教师和赤峰市乌兰牧骑的演奏人员对24首短曲进行演奏和录音。本人当时作为市乌兰牧骑乐器演奏员参加了此次演奏和录音，并有机会向赤峰雅乐艺人张海峰、刘百川等人学习演奏赤峰雅乐，对赤峰雅乐产生了浓厚的兴趣，从此走上了赤峰雅乐的传承之路。\n1985年，本人由赤峰市乌兰牧骑调入赤峰青少年宫从事校外艺术教育工作，这对赤峰雅乐在孩子们中间的传播传承提供了一方沃土。在多年的乐器教学中，我把赤峰雅乐的短曲编入器乐教材中，让孩子们在学习乐器演奏的初级阶段，就能接触到本地的非遗音乐，使雅乐影响力不断扩大。1991年，我将赤峰雅乐“雁阵”等短曲改编成四胡独奏“雁归塞北”，参加了国家文化部在广西柳州举办的“全国少年儿童少数民族乐器演奏评奖”，获得三等奖。乐曲曾发表于《内蒙古群文论坛》。1989年本人在赤峰青少年宫组建“红领巾乌兰牧骑小民乐队”，曾四次去北京、西安、杭州等地参加全国少年宫文艺汇演，演奏赤峰雅乐，受到了好评。1982年—2000年，赤峰雅乐的传播传承工作，只是在我力所能及的工作范围内，在少年宫学习音乐的学员当中进行。作为一名从事音乐教育的人，总感觉传播我们本地的非遗音乐应是我们的责任，应该尽一份力量。\n2001年，我调入红山区文化馆任馆长，红山区文化馆是赤峰雅乐的挖掘整理传承单位。在新的历史时期，如何做好赤峰雅乐的传承，使这一文化瑰宝得到大力的弘扬和发展，做了如下几个方面的工作：\n一、加强对赤峰雅乐的理论研究，对赤峰雅乐的流源、演奏风格、曲式结构、旋律进行等诸方面进行研究，力图对赤峰雅乐产生新的认识。我们曾三次聘请市内外音乐专家、作曲家对赤峰雅乐音乐特色等方面进行研讨，特别是赤峰雅乐在传承过程中和蒙古族音乐相融合的曲例进行深入的分析。大家一致认为：赤峰雅乐是蒙汉两个民族文化的结晶，是汉族文化和少数民族文化相互融合的产物，从而对赤峰雅乐有了一个全新的认识。我曾撰写论文《赤峰雅乐源流初探》，把赤峰雅乐的部分曲例和我们当地蒙古民歌、杠房音乐、佛乐以及承德清音等音乐进行分析比较，来论证赤峰雅乐和少数民族音乐相互融合的特点。该论文曾获得全国群众文化学会主办的2004年论文比赛的三等奖。\n二、培训演奏人员，建立赤峰雅乐演奏团队。\n（1）赤峰雅乐属于音乐类非遗项目，除了在媒体播放录音外，最主要的传播途径就是现场演奏来传达给观众，这就需要有一支演奏队伍，而这支队伍需要按现代民族乐团的编制组建，才能符合现代人民群众的欣赏水平。2003年，我们在红山区老年大学组建了赤峰雅乐演奏团，乐团吸收原专业文艺团体的退休人员和机关企业单位的具有演奏乐器基础的退休人员，组成了50人规模的演奏团体。由红山区老干部局和文化馆共同出资购买了乐器、服装。从此在红山大地上诞生了一支以演奏赤峰雅乐为主的，具有现代民族乐团的弓弦、弹拨、吹管、打击乐编制齐全的民乐团。该团成立20年来，常年坚持每周两次培训和排练，曾15次举办赤峰雅乐专场音乐会、参加社会文艺演出174场。该团在2012年被红山区人民政府挂牌为赤峰雅乐传承基地。\n（2）为了解决赤峰雅乐的传承后继有人的问题，从2006年起，我们先后在赤峰八中、赤峰回民实验小学、赤峰第十三小学组建了少年赤峰雅乐演奏团，让非遗音乐走进校园，让传统文化在孩子们中间传播传承更具有长远意义。十多年年来，我们在学校培训学员600多人次。赤峰回民实验小学已把赤峰雅乐授课列入“校本课”。2012年赤峰回民实验小学被红山区人民政府命名为赤峰雅乐传承基地。\n三、编配赤峰雅乐的总谱，为雅乐演奏提供一剧之本。建立了赤峰雅乐演奏团，有了演奏队伍，但乐团没有赤峰雅乐的演奏谱，传承演奏就无从谈起。当时的情况是：最开始挖掘的雅乐24首短曲，只是记录主旋律，乐团演奏雅乐短曲只能以齐奏的形式单一旋律演奏，演奏效果极差。1985年，内蒙古师范大学赵汝德先生写的赤峰雅乐套曲，在中央广播乐团演奏后，我们仅拿回了录音带，总谱早已不知去向。我们的资料库里只有雅乐24首短曲的主旋律和雅乐套曲的录音带。为了给乐团提供雅乐的演奏总谱，我利用半年时间，通过听雅乐的音响资料，重新记谱，完成了赤峰雅乐套曲的总谱编配工作，给演奏雅乐的乐队提供演奏范本。2022年，赤峰雅乐套曲的十首曲目手抄本总谱已印刷。\n四、坚持守正创新，在使雅乐的传承不走样的前提下，又有发展和创新。几千年来，雅乐的表现形式都是音乐、舞蹈、歌曲三位一体，而赤峰雅乐所传乐谱只有乐器演奏谱。为使赤峰雅乐的演奏更适合于现代听众的欣赏要求，我们把赤峰雅乐套曲的四首曲填词，以多声部合唱的形式融入乐队的演奏，极大增强了赤峰雅乐演奏的表现力，使听众更直观了解了雅乐所表现的思想内涵。我们还在雅乐的两首曲中加入舞蹈表演，丰富了雅乐的表现力，打破了雅乐只是乐器演奏单一形式，使观众耳目一新。\n五、为赤峰雅乐申报内蒙古自治区级非物质文化遗产项目提供资料。自2008年起，赤峰雅乐由赤峰市级文化遗产项目开始申报内蒙古自治区级非遗项目。为使这次“申遗”成功，我们“申遗”小组提供了赤峰雅乐套曲的十首曲目和乐谱，并提供了近20年来，赤峰雅乐的演出录音、录像、节目单、排练和教学的图片等资料。这些详实的材料，为赤峰雅乐的“申遗”起到了一定的作用。2011年，赤峰雅乐被列入内蒙古自治区非物质文化遗产名录。2018年，我本人被评为内蒙古自治区级非遗项目赤峰雅乐传承人。\n赤峰雅乐传承工作取得的成绩：\n（一）自2001年起，赤峰雅乐的传承有了自己的演奏队伍，而且这支演奏团队是老中青相结合的演奏团体，团队成员既有老一代专业艺术家，还有青年教师，更重要的是有一群中小学生，这就为赤峰雅乐的传承演奏增添了活力。古乐真正焕发出新声。\n（二）20多年来，赤峰雅乐演奏团队曾举办6场赤峰雅乐专题音乐会，特别是2018年举办的“月满中秋，雅乐古韵”音乐会由香港凤凰电视直播，参加人员达130人，取得了良好的演出效果。另外，赤峰雅乐演奏团自2010年起，曾五次参加赤峰市草原文化节的演出，四次在赤峰电视台录制播放赤峰雅乐，40次参加赤峰新年音乐会、社区文艺汇演、国庆音乐会、迎春音乐会，6次参加赤峰市红山区非遗文化节，并在每年6月1日儿童节进校园演奏赤峰雅乐，多次组织非遗音乐走进校园演唱会。红山晚报、赤峰日报、内蒙日报等多家媒体多次报道赤峰雅乐的传承工作。\n（三）回顾赤峰雅乐几十年的传承工作，最大的亮点有两个：一是我们建立了自己的演奏团队，把雅乐从资料库里解放出来，成为活生生的、可供人们欣赏的音乐；二是20年前，我们就把赤峰雅乐的传承工作重点放在学校，让孩子们传承经典，这对我们弘扬中华优秀传统文化意义重大。"
            },
            {
                    "id": "li-fu-complete-yayue",
                    "tag": "非遗文章",
                    "title": "我国最完整的雅乐：赤峰雅乐",
                    "author": "李富 搜集整理",
                    "summary": "文章系统梳理赤峰雅乐的渊源、曲谱保存、四大乐章、乐器编制、广播传播、套曲发行，以及张海峰在抢救整理中的关键贡献。",
                    "body": "我国最完整的雅乐：赤峰雅乐-文   李富-\n\n\n我国最完整的雅乐：赤峰雅乐\n\n李富 搜集整理\n\n赤峰雅乐渊源\n“雅乐”一词最早出现在《论语》中，它是与民间俗乐相对而言。“雅乐”即“正乐”，一般用于宗教、政治、礼仪等国家仪式中，体现王权和威严。封建王朝的统治者在取得王权后，都会依照惯例制作本朝“雅乐”来为国家礼制服务。所以，雅乐也是礼制的重要组成部分。雅乐，一般泛指宫廷祭祀活动和朝廷礼仪中所用的音乐，源于西周，至元代隋宫廷乐工离散而流于民间，演奏赤峰雅乐始于清光绪初年，最先传习雅乐者是赤峰元宝山矿矿主李林梓，后为晚清举人董成荣、秀才张朝清。\n\n“赤峰雅乐”挖掘整理、出版发行表彰大会，作者李富供图\n李惠清于1936年以个人名义，石印全套雅乐谱。他在为乐谱题写的序言中写道：“孔子圣人在齐闻韶尚三月不知肉味，乐之引人人自乐之也……余揣其私意，知今之乐犹古之乐也。是以集松州故友之佳曲，存先儒诹咨之好音，留为知音者袭而取也。”此书仅发一册，保存在医师刘伯川手中。50年代原赤峰市文化馆雅乐队曾挖掘、演奏过部分乐曲，并以“工尺字”译成简谱，惜在60年代后期散佚。“赤峰雅乐”开始在本地区流传，至今已有130余年。\n印制于康德三年的 “赤峰雅乐”全套工尺谱复印件，作者李富供图李惠清热衷于雅乐演奏，并组织了乐班。当时，每年农历五月十三日以及“盂兰盆会”等大规模庙会上都有雅乐演奏，影响盛极一时。赤峰地区的举人、秀才、文人雅士还成立了“雅乐会”。伪满政权统治时期，赤峰雅乐曾一度被日本侵略者改成伪满“国乐”，直到抗战胜利，所谓的“国乐会”才被解散。据孙孝良的《古乐新韵—近代赤峰雅乐探析》所载，1949年后，内蒙古自治区文化部门专门委派专家来赤峰搜集整理赤峰雅乐，共整理出13首乐谱。当时赤峰市文化馆尚有部分文艺工作者能演奏部分曲目，但在“文革”时期，因曲谱失传，再无人能演奏赤峰雅乐。1982年，红山区文化馆馆长张国清和音乐组组长李守臣邀请到82岁高龄的雅乐传承人张海峰，听他回忆了赤峰雅乐的曲目和曲谱，经过记录和整理，恢复了24支曲目并将之译成简谱，在张海峰和文化馆、乌兰牧骑音乐工作者的共同努力下，演奏出了新的赤峰雅乐。\n\n1983年《赤峰雅乐》在赤峰人民广播电台演奏录制实况，作者李富供图\n恢复后的赤峰雅乐由《大典》《四季》《雁旋》《龙腾》四个乐章组成。《大典》体现国家气度和权力威严，有《宫宴》《庆寿》《水龙吟》等乐段；《四季》是祭祀音乐，有《春来》《夏来》《秋来》《冬来》4个乐段，蕴含“以民为本”思想；《雁旋》以大雁来象征热恋故土、民族团结，乐段有《雁阵》《雁旋》《雁落平沙》；《龙腾》由《龙抬头》《龙腾》《龙尾》等乐段组成，以龙的腾跃来表现国家的繁荣昌盛。\n赤峰雅乐的曲调分为“小宫调”“正宫调”“尺子调”三大类。曲牌名多是根据乐思而制，有的沿用传统曲牌，如《水龙吟》。作为宫廷雅乐，赤峰雅乐的曲调多为帝王仪式音乐，如正宫调《龙头》《龙身》《龙尾》《水龙吟》；祭祀音乐《春来》《夏来》《秋来》《冬来》；宴庆活动的正宫调《庆寿》《正北宫》《雁落平沙》等，其音乐风格都适合表现怡然自得、四海升平的景象。因雅乐在赤峰流传时间长，在流传过程中逐渐与当地的蒙古族民歌、宗教音乐等形式相结合，逐渐形成了具备赤峰地区独特韵味的古乐。\n\n赤峰市专业团体在演奏赤峰雅乐，作者李富供图演奏赤峰雅乐的乐队人数需五六十人，演奏乐器有大鼓、怀鼓、云锣、苏笛、笙、双管儿、四弦、三弦、洞箫、胡琴、提琴，以及打击乐器星、铃铎、扑钗、云板。操弦者功夫出在拈、搬、揉、扣、推、扫以及速度和力度上，鼓板的作用相当于乐队的指挥，是乐队的灵魂。雅乐的传习者要有很高的文化素养、精神气质，才能切身体会到曲子的境界，从而在演奏中能与其他乐器融入一体。欣赏者则平心静气，心领神会，从而达到陶冶情操、净化心灵的目的。\n雅乐自古具有教化作用，是礼仪之邦的治国之本，它的传承表明了人们对“礼”和“雅”的认同。20世纪80年代，赤峰雅乐在中央人民广播电台播出引起强烈反响，其“中正平和，典雅纯正”的曲风被公认为是对中国雅乐的继承者，也是到目前为止我国最完整的雅乐。十一届三中全会后，为继续发扬民族艺术，赤峰市政协、文化局于1982年末联合成立“雅乐抢救小组”，并责成文化馆承担翻译曲谱、组织人员排练等项业务。此次挖掘、演奏得助于自幼酷爱音律、熟悉雅乐的张海峰老人，他以非凡的记忆力和娴熟的演奏技巧，口述“工尺字”，和年近古稀的徐俊及文化馆、乌兰牧骑部分青年音乐工作者一起切磋琢磨，反复排练。经一年多时间，形成最初的音响资料，并编印《赤峰雅乐》一书，共24支曲目：《庆寿》《小妹子》《北正宫》《中风韵》《尾繁续》《鹧鸪天》《龙头》《无僧佛》《飞蝴蝶》《水龙吟》《龙身》《龙尾》《鹧鸪地》《春来》《夏来》《秋来》《冬来》《来尾》《雁头》《雁阵》（雁序）《雁旋》《雁身》（雁行）《雁落平沙》《雁尾》。这些乐曲计分“尺字调”、“正宫调”、“小宫调”三大类。曲牌名是根据曲子所表达的乐思而作，有的则是沿用传统的词牌和曲牌，如《水龙吟》为高管统帅升帐时常用的曲牌。\n赤峰市老年之春艺术团在演奏《赤峰雅乐》，作者李富供图赤峰雅乐普以传统的“工尺字”作标示，爱好此乐者皆凭面授口传，教、学双方需要以自身的文化素养、生活阅历和精神气质，体会每支曲子的意境，揣摩其内涵，掌握其节奏，其抑扬顿挫、轻柔徐疾之风韵便油然而生。欣赏者则需心平气静，细心体会，才能感受到“雅乐”的中正、平和、宽舒、典雅的独特艺术风格。演奏时所用乐器有笙、管、笛、萧、三弦、提琴（亦称胡琴，其形似板胡）、云锣、大鼓、怀鼓、星、铃、铎、扑、钗、豆板等民族管、弦、打击乐。一个乐队十五六人左右。\n经初步调整的赤峰雅乐，于1984年9月10日由中央人民广播电台台播部向台湾同胞专题介绍五首乐曲。同年12月13日，中央人民广播电台文艺部向国内外听众介绍和播出，并由高云华编辑解说词。1984年至1986年，中国广播报、中国新闻社香港分社、内蒙古电视台等新闻单位均对“赤峰雅乐”连续进行报道和专题介绍。1986年10月，人民日版海外版、新华通讯社分别用中英文介绍“赤峰雅乐”的挖掘、整理情况。同年11月，中央电视台通过新闻联播节目再次播映赤峰雅乐。由于专家与地方有关部门的重视及从事挖掘整理此项古乐的工作人员共同努力，使赤峰雅乐从塞外小城传播海峡两岸，走向世界。\n\n老艺人们与文化馆、乌兰牧骑的同志们一同演奏“赤峰雅乐”，作者李富供图2003年，赤峰雅乐队正式成立。2004年赤峰雅乐队演奏的《庆寿》《水龙吟》《北正宫》被中央电视台国际频道《走遍中国》栏目，以《古韵新风》为题，录制成专题节目。目前，雅乐队已有30多人的庞大阵容。\n赤峰雅乐，2011年4月列入第二批市级非物质文化遗产代表性项目名录；2011年8月列入第二批自治区级非物质文化遗产代表性项目名录。\n\n赤峰最早的《赤峰雅乐》版本《赤峰雅乐》最早的版本是保存于韩诚勇家的《十番·翕纯缴绎谱》。按：“翕纯敏绎”四字，是对这组乐曲的批语，此系孔子说的“乐其可知也：始作，翕如也；从之，纯如也，皦如也，绎如也，以成。”。这句古语的简化意为：这是一组旋律和谐、曲调精美、音响清晰，听起来有连绵不断之感的十番乐曲。此乃最早对赤峰雅乐的评语。\n\n赤峰最早的赤峰雅乐盒带\n为使赤峰雅乐以其完整的艺术形象跻身于中国民族艺术之林，红山区邀请内蒙古师范学院音乐系副教授赵汝德将《赤峰雅乐》改编成《赤峰雅乐套曲》。改编后的套曲既保持古朴典雅、雍容华贵的宫廷音乐气度和魅力，又加强其节奏鲜明的舞蹈性。\n1988年12月发行的“赤峰雅乐”套曲盒式带发行海内外，作者李富供图“套曲”将原雅乐24首乐曲收用23首，然后根据曲牌原来的命名和乐曲基本格调，合并为13首，计分四段；第一段《大典》，通过开基大典的朝贺和宴轻仪典，体现国家的气度和权力的威仪；第二段《四季》，通过对春播、夏锄、秋收、冬藏农事活动的描绘与渲染，讴歌劳动人民热爱生活、建设生活的热情；第三段《雁旋》，借合群的秉性及热爱故土的恋情，象征祖国大家庭各民族和睦相处、情迷团结的情景；第四段《龙腾》，意在以民间盛会龙舞的热烈气氛，表现祖国繁荣昌盛、万民欢腾的景象，用龙的形象象征中华民族的凝聚力和恢宏的气概。\n中央人民广播电台文艺部于1987年7月向全国介绍播放“套曲”，并做为向全国各广播电台交换的民族节目之一。1998年12月中国民族音乐资料编辑部责成广州白天鹅音像艺术有限公司将“套曲”印制成盒式带发行国内外。“套曲”已收入中国民族音乐资料东南亚版，并纳入中国民族音乐（资料）精选录音带。“套曲”已在法国国际图书博览会上展出。\n“套曲”是目前国内最完整的“雅乐”，具有重要的艺术价值，是祖国民族音乐的瑰宝。\n赤峰雅乐最重要的演奏者和对赤峰雅乐抢救工作贡献最大者张海峰\n\n赤峰雅乐最重要的演奏者和对赤峰雅乐抢救工作贡献最大者张海峰先生。作者李富供图张海峰(1903——1992)，赤峰市（今红山区）人，4岁丧母，因家贫，11岁时，父亲把他舍身赤峰五道街洪福寺（一名财神庙)当和尚，为佛门性瑞弟子，师父给他起个法号叫海峰。性瑞和尚为蒙古族，既不通音律，也不诵读经卷，唯嗜吸鸦片，因而对小海峰，不闻不问，听之任之。由于当时赤峰街里各寺庙，没有一个和尚会使用乐器，当张海峰12岁时，便投奔喀喇沁旗楼子店乡二道营子关帝庙，师从自丰、自申两和尚，学习吹笙，一共去了三个冬季，学会佛曲和民间乐曲不下百余首，这两位和尚便是他的启蒙老师。\n有一年，张海峰去喀喇沁旗洞山佛寺闲住，又从广训、广博两和尚学习佛曲，在那里，他们又教他一首由赤峰街里传去的十番乐曲——《水龙吟》（后来称为雅乐）。当他得知这支乐曲是由洞山佛寺用重金聘请赤峰街的李惠清先生教习的时候，便返回赤峰，拜私垫先生李让泉秀才为师，学会全部十番乐曲。这是他的第二位音乐教习。\n内蒙古民族器乐专家采访张海峰先生，作者李富供图\n有一次，张海峰云游到赤峰初头朗乡的法轮寺，正好那里来了一位去多伦探亲、途中在此停留的山东曲阜乐班吹笙的孙某，于是从他学习笙的吹奏法，承蒙指点，得其神髓，从此技艺大进，故海峰的吹笙，较他人别有一种韵味。张海峰出家之前，没念过一天书，他的文化是以后学的，起初跟福音堂牧师教汉语的陈凤和学习，以后又跟私塾先生张景康和张子元学习。当他29岁至31岁时，又去赤峰二中街华兴池东侧的乡村师范念了两年书。伪满时期，赤峰县教育局设在洪福寺院内，因其是那里的和尚，常与局长杜泮清有交往，于1935年，经杜的推荐，便在教育局学务股当了一名见习科员，于是他告别了青灯黄卷的清贫生活而还俗。每月工资15元。以后他又考取了正式科员，月薪增至30元。1938年改任教职，初在洪福寺小学教书，不久，被保送到承德师范培训班学习半年。其间，得到赤峰东水地倪恩衔和西大沟村的姚奎两同学的帮助，顺利完成初师学业。此后他又调入赤峰建昌营、洪福寺等小学任校长多年，后来又到承德行政干校学习半年，毕业后，升任赤峰县九区教育助理，1951年改派永合营子等校任小学教师。1958年以病为由，有关部门强迫其退职，发给一笔退职金了事，从此，他便成了无业游民，直到逝世强迫他退职的错误也未得到改正。十年浩劫，这位出身贫苦而又清白的老人，亦未幸免于难，全家被赶到赤峰县哈达和硕村，一住多年。后来才举家迁回赤峰。\n张海峰先生与李宝祥等老师为专家们现场演奏雅乐，作者李富供图1983年，红山区政协成立了国乐抢救小组，整理赤峰雅乐，方请老先生出头，仅靠工尺谱是不行的，还得张先生哼着曲子，由红山区文化馆员李守臣记录，整理成简谱。赤峰雅乐的译谱工作，在张老的帮助下，得以能顺利完成。演奏时，张老不但领奏，还反复指点，尽量恢复其原有韵味。因此，没有张海峰的鼎力协助，便没有今天的雅乐，洵非虚语。雅乐录制成功并播放以后，在国内外引起强烈反响。\n1984年，他又把珍藏多年的21首佛曲谱献给红山区政协，在他的指导下，完成了录制工作，并在中央人民广播电台播放。由于这两大贡献，赤峰市红山区政府曾发给他一笔奖金。\n赤峰雅乐，虽已录制成功，但在张先生看来，并非尽善尽美，他说：“雅乐是由十种主要器乐组成的乐队演奏的，但每种器乐都有每种的味，笛子有笛子的味，箫有箫的味，每种器乐达不到各自应有的味时，合起来也不行，不中听。只有每位演奏者都达到一定的艺术造诣，合奏起来，才算成功。这种临时‘抱佛脚'的做法，是一种缺欠。”\n\n本文查阅并参考了《赤峰之最》《赤峰非物质文化遗产项目名录》《赤峰市志》《赤峰市红山区文化志》等，在此表示感谢。\n\n\n\n作者简介\n犁夫，本名李富，文学学士学位，作家、记者、评论家、剧作家、词作家、编导，中国寓言文学研究会特邀评论家，内蒙古民族文化艺术研究院研究员，内蒙古作家协会会员。\n著有《我阅读草原》《父亲》《中国首部旱作农业诗典》《辽都往事》《大辽契丹的历史故事和民间传说》《瓜川是故乡》等多部作品。\n犁夫先后在新华社、中新社、《人民日报》《光明日报》《十月》《散文》《草原》《青年文摘》《微型小说选刊》《小说月报》《天池》《小小说选刊》香港《大公报》《文汇报》台湾《台湾好报》美国《侨报》等海内外800多家媒体上发表作品，500多万字。   \n2020年，犁夫被评为“中国闪小说十大新锐作家”，获得“蒙古马”全球征文一等奖，获得中国西部最佳美文奖。\n2021年，犁夫的文艺评论被评为中国闪小说十大热点事件，摄影作品获得中国航展摄影大赛奖，获得“大美松山”全国摄影奖，散文诗获得建党百年征文一等奖。\n2022年，犁夫获得深圳文艺评论奖。"

                    "body": "赤峰雅乐传承与发展\n赤峰雅乐是内蒙古自治区非物质文化遗产，具有深厚的历史文化底蕴。其音乐形式独特，旋律优美，展现了草原文化的独特魅力。\n历史渊源\n赤峰雅乐的历史可以追溯到元代，经过数百年的发展和传承，形成了独具特色的音乐体系。其中包含了丰富的器乐演奏、声乐演唱以及仪式音乐等多种形式。\n音乐特点\n赤峰雅乐的音乐特点主要表现在以下几个方面：\n1. 曲调优美，富有草原特色\n2. 乐器搭配独特，以传统乐器为主\n3. 演奏形式多样，包括独奏、重奏和合奏\n4. 具有鲜明的仪式性和庄重感\n传承发展\n为了更好地传承和发展赤峰雅乐，当地采取了多项措施：\n1. 建立专门的传承基地\n2. 开展定期的培训活动\n3. 举办展演和交流活动\n4. 进行系统的音乐记录和整理"

                    "body": "赤峰民歌是中国北方草原音乐文化的重要组成部分，它融合了蒙古族、汉族等多民族的音乐元素，形成了独具特色的音乐风格。本文将从历史渊源、艺术特色以及现代传承三个方面，对赤峰民歌进行深入探讨。\n\n一、历史渊源\n\n赤峰民歌的历史可以追溯到元代，当时蒙古族游牧文化与中原农耕文化的交融，为赤峰民歌的形成奠定了基础。明清时期，随着移民的增加，汉族音乐元素逐渐融入其中，形成了独特的音乐风格。\n\n20世纪初，赤峰民歌开始被系统收集和研究。许多音乐学者深入草原，记录并整理了大量的民歌资料，为赤峰民歌的传承和发展做出了重要贡献。\n\n二、艺术特色\n\n赤峰民歌的艺术特色主要体现在以下几个方面：\n\n1. 音调特色：赤峰民歌多采用五声音阶，旋律起伏较大，节奏自由，表现力丰富。\n\n2. 演唱方式：有独唱、对唱、轮唱等多种形式，常常在野外劳作或节日庆典中自然演唱。\n\n3. 题材内容：内容丰富多样，包括反映生产生活、歌颂爱情友谊、赞美自然风光等多种题材。\n\n三、现代传承与发展\n\n近年来，随着社会的发展和人们生活方式的变化，赤峰民歌的传承面临一定挑战。但同时，也出现了许多积极的变化：\n\n1. 教育传承：将民歌教育引入学校课程，培养年轻一代对传统音乐的兴趣。\n\n2. 艺术创新：许多音乐家对传统民歌进行创新改编，使其更符合现代审美。\n\n3. 数字保护：利用现代技术对民歌进行数字化记录和保存，建立数据库。\n\n4. 文化活动：定期举办民歌比赛、音乐节等活动，提高民歌的社会影响力。\n\n结语\n\n赤峰民歌作为中国草原音乐文化的瑰宝，承载着深厚的历史文化内涵。在新时代，我们应当在保护传统的基础上进行创新发展，使这一宝贵的音乐遗产在现代社会焕发新的生机。"

                    "body": "蒙古族长调民歌是蒙古族传统音乐中最具代表性的音乐形式之一，被誉为\"草原上的艺术明珠\"。本文将对蒙古族长调民歌的艺术特色进行深入分析。\n\n一、长调民歌的基本特征\n\n蒙古族长调民歌，顾名思义，其最显著的特点就是曲调悠长。一般来说，长调民歌具有以下基本特征：\n\n1. 音域宽广：一般可达两个八度以上，有些甚至超过三个八度。\n\n2. 节奏自由：没有固定的拍子和节奏，演唱者可根据情感需要自由伸缩。\n\n3. 装饰音丰富：大量运用颤音、滑音等装饰技巧，增强表现力。\n\n4. 结构完整：一般包括前奏、主歌和尾声三个部分，形成完整的音乐结构。\n\n二、演唱技巧与表现力\n\n蒙古族长调民歌的演唱技巧极为复杂，需要长期的专业训练。主要技巧包括：\n\n1. 气息运用：需要强大的肺活量和气息控制能力，能够在一口气中完成长句的演唱。\n\n2. 喉音技巧：独特的喉音发声方法，能够产生特殊的声音共鸣效果。\n\n3. 情感表达：通过音色变化、力度控制等手段，表达丰富的情感内涵。\n\n三、文化内涵与价值\n\n蒙古族长调民歌不仅是一种音乐形式，更是蒙古族文化的重要载体。它蕴含的文化内涵主要表现在：\n\n1. 草原情怀：反映了蒙古族人民对广阔草原的热爱和依恋。\n\n2. 历史记忆：许多长调民歌记录了重要的历史事件和人物。\n\n3. 哲学思考：表达了对生命、自然和宇宙的思考。\n\n四、代表性曲目分析\n\n《四季》：这是一首描绘蒙古草原四季变化的经典长调民歌。曲调以宽广的音域和自由的节奏，生动地描绘了春夏秋冬的景色变化和牧民生活的场景。\n\n《思恋》：这首情歌以其深情的旋律和丰富的情感表达著称。演唱者通过细腻的声音控制和装饰音的运用，表达了深沉的思念之情。\n\n结语\n\n蒙古族长调民歌以其独特的艺术魅力，不仅在中国，而且在世界音乐舞台上都占有重要地位。了解和欣赏这一音乐形式，有助于我们更全面地理解蒙古族文化的丰富内涵。在现代社会，我们应当重视对这一非物质文化遗产的保护和传承，使其继续绽放光彩。"
            },

                    "summary": "马头琴是蒙古族传统乐器，本文介绍其制作工艺、演奏技法及文化内涵。",
                    "body": "马头琴是蒙古族最具代表性的传统乐器，以其独特的形状和深沉悠扬的音色著称。本文将详细介绍马头琴的制作工艺、演奏技法及其文化内涵。\n\n一、马头琴的历史起源\n\n马头琴的历史可以追溯到13世纪，相传是由成吉思汗时期的一位勇士发明的。由于琴头雕刻成马头形状，因此得名\"马头琴\"。在蒙古族的传统中，马头琴被视为马的化身，象征着蒙古族人与马的深厚感情。\n\n二、制作工艺\n\n传统马头琴的制作是一门精湛的工艺，主要包括以下步骤：\n\n1. 选材：琴身通常选用松木或杨木等材质，琴杆选用硬木，琴弦早期使用马尾，现代多用金属弦。\n\n2. 制作琴身：将木材挖空成六角形或梯形音箱，前面蒙以蛇皮或薄羊皮作为共鸣面。\n\n3. 雕刻琴头：在琴杆顶端精心雕刻马头，这是马头琴最具标志性的部分，需要技艺精湛的工匠精心制作。\n\n4. 安装琴弦和琴马：琴马是一个小支架，支撑琴弦并传递振动到共鸣箱。\n\n5. 调音与试音：完成后进行精细调整，确保音色纯正。\n\n三、演奏技法\n\n马头琴的演奏技法独特而丰富，主要包括：\n\n1. 基本姿势：演奏者通常坐着演奏，将琴身支在左腿上，右手持弓，左手按弦。\n\n2. 弓法：包括长弓、短弓、跳弓等多种技法，通过不同的弓法可以表现不同的音乐效果。\n\n3. 指法：左手指法包括按弦、滑音、揉弦等，能够表现丰富的音乐情感。\n\n4. 特殊技巧：如模仿马嘶、风声、鸟鸣等自然声音的特殊演奏技巧，是马头琴音乐的重要表现手段。\n\n四、文化内涵\n\n马头琴不仅是一种乐器，更是蒙古族文化的重要载体：\n\n1. 草原文化的象征：马头琴的音色能够生动地表现草原的辽阔和蒙古族人的豪放性格。\n\n2. 精神寄托：在传统蒙古族社会中，马头琴常被用来抒发情感，传递思念。\n\n3. 仪式功能：在重要的宗教仪式和民间庆典中，马头琴常扮演重要角色。\n\n五、当代传承与发展\n\n近年来，马头琴艺术得到了更好的传承和发展：\n\n1. 教育传承：在音乐学院和民族学校设立专门的马头琴教学课程。\n\n2. 创新发展：将马头琴与现代音乐相结合，创作出具有时代特色的新作品。\n\n3. 国际交流：通过国际音乐节和文化交流活动，将马头琴音乐推向世界舞台。\n\n结语\n\n马头琴作为蒙古族传统文化的重要组成部分，承载着丰富的历史和文化内涵。了解马头琴的制作工艺和演奏技法，有助于我们更深入地理解蒙古族文化的独特魅力。在现代社会，我们应当重视对这一非物质文化遗产的保护和传承，使其在新时代继续发扬光大。"

                    "body": "赤峰地区的传统戏曲是中国北方地区戏曲文化的重要组成部分，融合了蒙古族、汉族等多民族的艺术元素，形成了独具特色的地方戏曲风格。本文将对赤峰地区传统戏曲的历史沿革、艺术特色及其在当代的传承状况进行系统梳理。\n\n一、历史沿革\n\n赤峰地区的传统戏曲可以追溯到元代，当时随着大量汉族人口的迁入，中原地区的戏曲艺术也传入了赤峰。到了明清时期，由于商业的发展和文化的交流，赤峰地区形成了以二人台、蒙古剧等为代表的地方戏曲体系。\n\n近代以来，随着社会变革和文化演进，赤峰地区的传统戏曲也经历了一系列的变化和发展，吸收了现代戏剧的表现手法，内容上也更加贴近现代生活。\n\n二、艺术特色\n\n赤峰地区传统戏曲的艺术特色主要表现在以下几个方面：\n\n1. 音乐特点：融合了蒙古族长调和汉族民歌的元素，形成独特的板式和曲调。音乐气势恢宏，同时又不失细腻，能够准确表达人物情感。\n\n2. 表演风格：表演风格豪放中见细腻，动作夸张而不失真实，善于通过程式化的动作表达内心情感。\n\n3. 剧目题材：剧目题材广泛，包括历史故事、民间传说、爱情故事以及现实生活等多种题材，反映了各个时期的社会生活和民众心理。\n\n4. 舞台美术：舞台设计简洁明快，服装色彩鲜艳，妆容夸张有特点，整体视觉效果鲜明生动。\n\n三、代表剧种分析\n\n1. 二人台\n\n二人台是赤峰地区最具代表性的地方戏曲之一，起源于清代。它以生、旦两个角色为主，表演形式灵活多变，可以是独角戏，也可以是多人合演。音乐采用板胡伴奏，唱腔高亢激昂，表演夸张生动，深受当地群众喜爱。\n\n2. 蒙古剧\n\n蒙古剧是在蒙古族传统说唱艺术基础上发展而来的综合性舞台艺术，它融合了蒙古族民歌、舞蹈和说唱艺术的元素。蒙古剧的表演强调集体舞蹈和合唱，场面宏大，气势磅礴，具有浓郁的草原特色。\n\n四、当代传承状况\n\n随着社会的发展和人们生活方式的变化，赤峰地区传统戏曲的传承面临一定的挑战。但同时，也出现了许多积极的变化：\n\n1. 保护政策：国家和地方政府出台了一系列政策，将传统戏曲列入非物质文化遗产保护名录，提供专项资金支持其传承与发展。\n\n2. 教育传承：在专业院校和民间艺术团体中设立传统戏曲专业，培养新一代戏曲人才。\n\n3. 创新发展：在保持传统特色的基础上，积极创新表现形式和内容题材，使传统戏曲更贴近当代观众的审美需求。\n\n4. 媒体传播：利用电视、网络等现代媒体手段，扩大传统戏曲的传播范围和影响力。\n\n五、面临的挑战与发展前景\n\n目前，赤峰地区传统戏曲面临的主要挑战包括：观众老龄化、年轻人兴趣减少、专业人才匮乏等。但同时，随着文化自信的增强和非物质文化遗产保护意识的提高，传统戏曲也迎来了新的发展机遇。\n\n未来，赤峰地区传统戏曲的发展前景主要在于：一方面要坚持原汁原味的传统艺术表演，另一方面要适应时代发展，进行适当的创新和改革，使传统戏曲在新时代焕发新的活力。\n\n结语\n\n赤峰地区的传统戏曲凝聚了当地人民的智慧和情感，是宝贵的文化遗产。在新时代，我们应当更加重视对传统戏曲的保护和传承，使其成为连接历史与未来的文化纽带，为构建中华民族共同体意识和促进民族团结作出贡献。"
            }
    ];

    function playArchiveMusic() {
        if (!archiveMusicAudio) {
            archiveMusicAudio = new Audio(ARCHIVE_BGM_SRC);
            archiveMusicAudio.loop = true;
            archiveMusicAudio.volume = 0.35;
        }
        archiveMusicAudio.currentTime = 0;
        archiveMusicAudio.play().catch(() => {});
    }

    function stopArchiveMusic() {
        if (!archiveMusicAudio) return;
        archiveMusicAudio.pause();
        archiveMusicAudio.currentTime = 0;
    }

    function openScoreOverlay() {
        document.getElementById('scoreOverlay').classList.add('open');
        playArchiveMusic();
        setArchiveTab('scores');
        document.getElementById('scoreSearch').value = '';
        currentFilter = '全部';
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === '全部'));
        renderScoreList();
    }

    function closeScoreOverlay() {
        document.getElementById('scoreOverlay').classList.remove('open');
        stopArchiveMusic();
    }

    function setArchiveTab(tab) {
        currentArchiveTab = tab;
        document.querySelectorAll('.archive-tab').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.archiveTab === tab);
        });
        document.querySelectorAll('.archive-page').forEach(page => page.classList.remove('active'));
        const target = document.getElementById(`archive${tab.charAt(0).toUpperCase()}${tab.slice(1)}`);
        if (target) target.classList.add('active');
        if (tab === 'scores') renderScoreList();
        if (tab === 'story') renderStoryArchive();
        if (tab === 'instruments') renderInstrumentArchive();
    }

    function setFilter(btn) {
        currentFilter = btn.dataset.cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderScoreList();
    }

    function renderScoreList() {
        if (!document.getElementById('scoreList')) return;
        const kw = document.getElementById('scoreSearch').value.trim().toLowerCase();
        let list = MUSIC_DATA.filter(m => {
            const matchCat = currentFilter === '全部' || m.cat === currentFilter;
            const matchKw = !kw || m.title.includes(kw) || m.category.includes(kw) || m.instrument.includes(kw);
            return matchCat && matchKw;
        });
        document.getElementById('scoreCount').textContent = `共 ${list.length} 首曲目`;
        document.getElementById('scoreList').innerHTML = list.map(m => `
            <div class="music-card" onclick="openScoreViewer('${m.id}')">
                <img class="music-card-cover" src="${m.cover}" onerror="this.style.background='#f7f9fc';this.style.border='1px solid #dbe3ef'" alt="${m.title}">
                <div class="music-card-info">
                    <div class="music-card-title">${m.title}</div>
                    <div class="music-card-meta">
                        <span class="tag">${m.cat}</span>
                        <span>${m.category}</span>
                        <span>乐器：${m.instrument}</span>
                    </div>
                </div>
                <span class="music-card-arrow">›</span>
            </div>
        `).join('');
    }

    function escapeHtml(text) {
        return String(text).replace(/[&<>"]/g, ch => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;'
        }[ch]));
    }

    function isArticleHeading(line) {
        if (line.length > 24) return false;
        if (/[。！？；，、]$/.test(line)) return false;
        return /^(我的赤峰雅乐传承之路|我国最完整的雅乐|赤峰雅乐渊源|作者简介|赤峰雅乐传承工作取得的成绩|[一二三四五六七八九十]、|（[一二三四五六七八九十]+）)/.test(line);
    }

    function formatHeritageArticle(text) {
        return String(text)
            .split(/\n+/)
            .map(rawLine => rawLine.trim())
            .filter(Boolean)
            .map(line => {
                const className = isArticleHeading(line) ? ' class="article-heading"' : '';
                return `<p${className}>${escapeHtml(line)}</p>`;
            })
            .join('');
    }

    function renderInstrumentArchive() {
        const root = document.getElementById('archiveInstruments');
        if (!root || root.dataset.rendered === 'true') return;
        root.innerHTML = `
            <div class="archive-grid">
                <section class="archive-card archive-wide">
                    <h3>乐器志的定位</h3>
                    <p>这里不是完整百科，而是把传统乐器资料整理成与当前混音游戏相关的“声部解释”。后续每新增一个游戏乐器，都可以在这里补充它与赤峰雅乐传统乐队的关系。</p>
                </section>
            </div>
            <div class="instrument-archive-grid">
                ${YAYUE_INSTRUMENT_ARCHIVE.map(item => `
                    <article class="instrument-archive-card">
                        <span class="family">${item.family}</span>
                        <h3>${item.name}</h3>
                        <p>${item.text}</p>
                    </article>
                `).join('')}
            </div>
        `;
        root.dataset.rendered = 'true';
    }

    function openScoreViewer(id) {
        const m = MUSIC_DATA.find(x => x.id === id);
        if (!m) return;
        document.getElementById('viewerTitle').textContent = m.title;
        document.getElementById('viewerDesc').textContent = m.description;
        const content = document.getElementById('viewerScoreContent');
        if (m.scores && m.scores.length) {
            if (m.layout === 'tabs') {
                const tabs = m.scores;
                content.innerHTML = `
                    <div style="display:flex;gap:8px;margin-bottom:16px;">
                        ${tabs.map((t, i) => `
                            <button onclick="switchScoreTab(this, 'score-tab-${i}')"
                                style="padding:6px 18px;border-radius:16px;border:1px solid ${i===0?'#d4af37':'#d4dbe6'};
                                background:${i===0?'#fff7e8':'#f7f9fc'};color:${i===0?'#8b6b18':'#667085'};
                                cursor:pointer;font-size:13px;font-family:'Microsoft YaHei',sans-serif;transition:all 0.2s;">
                                ${t.label}
                            </button>
                        `).join('')}
                    </div>
                    ${tabs.map((t, i) => `
                        <div id="score-tab-${i}" style="display:${i===0?'block':'none'}">
                            <img class="viewer-score-img" src="${t.url}" alt="${t.label}"
                                onerror="this.outerHTML='<div style=\'color:#8a94a7;text-align:center;padding:20px\'>${t.label}暂无法加载</div>'">
                        </div>
                    `).join('')}
                `;
            } else {
                content.innerHTML = m.scores.map((s, i) => {
                    const url = typeof s === 'string' ? s : s.url;
                    const label = typeof s === 'string' ? `第${i+1}页` : s.label;
                    return `<img class="viewer-score-img" src="${url}" alt="${label}" onerror="this.outerHTML='<div style=\'color:#8a94a7;text-align:center;padding:20px\'>${label}暂无法加载</div>'">`;
                }).join('');
            }
        } else {
            content.innerHTML = '<div class="viewer-no-score">暂无曲谱资源</div>';
        }
        document.getElementById('scoreViewer').classList.add('open');
    }

    function closeScoreViewer() {
        document.getElementById('scoreViewer').classList.remove('open');
    }

    function switchScoreTab(btn, tabId) {
        // 切换按钮样式
        const btns = btn.parentElement.querySelectorAll('button');
        btns.forEach(b => {
            b.style.borderColor = '#d4dbe6';
            b.style.background = '#f7f9fc';
            b.style.color = '#667085';
        });
        btn.style.borderColor = '#d4af37';
        btn.style.background = '#fff7e8';
        btn.style.color = '#8b6b18';
        // 切换内容
        const allTabs = btn.closest('div').nextElementSibling;
        let el = allTabs;
        while (el) {
            if (el.id && el.id.startsWith('score-tab-')) el.style.display = 'none';
            el = el.nextElementSibling;
        }
        document.getElementById(tabId).style.display = 'block';
    }

    // ESC 关闭
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            closeScoreViewer();
            closeScoreOverlay();
        }
    });

</script>

</body>
</html>
